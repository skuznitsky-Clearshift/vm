<style>
  :root{
    --bg:#0b0d10;
    --ink:#e9e7e2;
    --ink-2:#c7ccd4;
    --ink-3:#767d88;
    --ink-4:#4e545d;
    /* the brand blue, dark-mode variant. #167398 is the exact logo colour and
       belongs on light paper only - on near-black it falls to about 3.4:1 and
       reads as a dead, muddy teal. */
    --brand:#5fb4d6;
    --brand-dim:#2b6c86;
    /* coins are steel, not gold: colour in this screen marks where you are and
       nothing else. gold rings competed with the blue wordmark for the eye. */
    --steel:#39404a;
    --steel-2:#20252c;
    --coin-bg:#111419;
    --orbit:#1c2129;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 "Segoe UI Variable Text","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #dial{position:relative}

  /* two orbit rings. the dashed one drifts very slowly, so the screen is never
     quite static without ever asking to be looked at. */
  .orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
         border:1px solid var(--orbit);border-radius:50%;pointer-events:none}
  .orbit.dash{border-style:dashed;border-color:#171b21;
              animation:spin 240s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.orbit.dash{animation:none}}

  /* centre medallion */
  #hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
       border-radius:50%;background:#0d1014;border:1px solid #2b333c;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:9px;text-align:center}
  #hub::after{content:"";position:absolute;inset:13px;border-radius:50%;
              border:1px solid #171c22;pointer-events:none}
  /* a Latin lockup keeps mark-left / wordmark-right even on an RTL page. the
     source PNG has an opaque white background, so it goes in as an alpha mask
     painted with the brand token - never as a plain <img>. */
  #logo{direction:ltr;background-color:var(--brand)}
  #hub .apps{font-size:11px;letter-spacing:.44em;color:var(--ink-3);
             direction:ltr;padding-left:.44em}

  /* coins */
  .coin{position:absolute;width:172px;margin-left:-86px;margin-top:-58px;
        text-align:center;text-decoration:none;color:inherit;
        opacity:0;transform:translateY(10px);
        animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards;outline:none}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .disc{position:relative;width:96px;height:96px;margin:0 auto;border-radius:50%;
        background:var(--coin-bg);border:1px solid var(--steel);
        display:flex;align-items:center;justify-content:center;
        transition:border-color .22s,background-color .22s,transform .22s,box-shadow .22s}
  .disc::before{content:"";position:absolute;width:76px;height:76px;border-radius:50%;
                border:1px solid var(--steel-2);transition:border-color .22s}
  .disc svg{width:30px;height:30px;stroke:var(--ink-2);stroke-width:1.35;fill:none;
            stroke-linecap:round;stroke-linejoin:round;transition:stroke .22s}
  .coin .name{display:block;margin-top:14px;font-size:13.5px;color:var(--ink-2);
              line-height:1.45;transition:color .22s}
  .coin:hover .disc,.coin:focus-visible .disc{
    border-color:var(--brand);transform:translateY(-4px);
    background:#101820;box-shadow:0 14px 34px rgba(0,0,0,.55)}
  .coin:hover .disc::before,.coin:focus-visible .disc::before{border-color:var(--brand-dim)}
  .coin:hover .disc svg,.coin:focus-visible .disc svg{stroke:var(--brand)}
  .coin:hover .name,.coin:focus-visible .name{color:#f2f4f7}
  .coin:active .disc{transform:translateY(-1px)}

  /* a tool that only runs from a synced local file cannot open on a phone.
     it stays visible but says so, instead of being a link that does nothing. */
  .coin.off .disc{border-color:#262b33;background:#0d1013}
  .coin.off .disc svg{stroke:#5a616b}
  .coin.off .name{color:#767d88}
  .coin.off .why{display:block;font-size:11px;color:#5c626b;margin-top:3px}
  .why{display:none}

  /* one hint line, only while a coin is under the cursor. no permanent
     sub-labels - those are what made the first sketch look like a form. */
  #hint{position:fixed;left:0;right:0;bottom:64px;text-align:center;
        font-size:12.5px;color:var(--ink-3);opacity:0;transition:opacity .2s;
        pointer-events:none}
  #hint.on{opacity:1}

  #stamp{position:fixed;bottom:20px;right:22px;font-size:10.5px;

         SKGate.use(s)  -> log one meaningful action ("pdf", "xlsx", ...)
         SKGate.id      -> this device id (8 hex) — the value to block
         SKGate.who     -> the stored name
         SKGate.forget() -> clear identity on this device (for testing)
   ==========================================================================*/
(function () {
  'use strict';
  if (window.SKGate) return;

  /* ---------------------------------------------------------------- config */
  /* Lives in the vm repo for now because that repo already exists and already
     has working push credentials. Moving it is a one-line change here plus a
     re-run of apply-all.ps1 — see README.txt. */
  var DEFAULT_GATE =
    'https://raw.githubusercontent.com/skuznitsky-Clearshift/vm/main/gate.json';

  var tag = document.currentScript;
  var ds  = (tag && tag.dataset) || {};

  var CFG = {
    tool  : String(ds.tool || '??').slice(0, 8),
    verS  : String(ds.ver  || '0'),
    built : String(ds.built || ''),
    maxAge: parseInt(ds.maxage, 10) || 60,   /* days of offline grace */
    ttl   : parseInt(ds.ttl, 10) || 24,      /* hours an OK verdict is reused */
    gate  : String(ds.gate || DEFAULT_GATE),
    log   : String(ds.log || ''),
    wait  : parseInt(ds.wait, 10) || 3500    /* ms before giving up on the net */
  };

  /* "1.6" -> 1006 so that 1.10 sorts above 1.9 */
  function vnum(s) {
    var p = String(s).replace(/[^0-9.]/g, '').split('.');
    return ((parseInt(p[0], 10) || 0) * 1000) + (parseInt(p[1], 10) || 0);
  }
  var VER = vnum(CFG.verS);

  /* The only two messages that can ever be shown. The decision file picks one
     by number; it cannot supply a third. */
  var MSG = {
    1: 'הגרסה הזו ישנה - נא להוריד גרסה עדכנית',
    2: 'אין גישה לממשק - צור קשר עם ספיר'
  };

  /* The team. A name typed that is not on this list is accepted and marked as
     new in the log, so adding someone does not require a build. */
  var TEAM = ['ספיר', 'יובל', 'יוסי', 'יצי', 'אסף', 'גדעון',
              'דניאל', 'עידו', 'אביהו', 'אנה', 'ישי', 'אודי'];

  /* ------------------------------------------------------- guarded storage */
  /* In the SharePoint srcdoc iframe every one of these THROWS SecurityError
     rather than returning null, and an unguarded read kills the whole script. */
  var storeOK = true;
  function sget(k) {
    try { return window.localStorage.getItem(k); }
    catch (e) { storeOK = false; return null; }
  }
  function sset(k, v) {
    try { window.localStorage.setItem(k, v); return true; }
    catch (e) { storeOK = false; return false; }
  }
  function sdel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  /* All tools share one file:// storage bucket (verified: Chrome reports
     origin "file://" for every path), so keys must be namespaced — and the
     identity is therefore asked once per device for ALL tools, not per tool. */
  var K_ID = 'sk.iid', K_WHO = 'sk.who', K_OK = 'sk.gateok';

  function newId() {
    var a = new Uint8Array(4), s = '', i;
    try { window.crypto.getRandomValues(a); }
    catch (e) { for (i = 0; i < 4; i++) a[i] = Math.floor(Math.random() * 256); }
    for (i = 0; i < 4; i++) s += ('0' + a[i].toString(16)).slice(-2);
    return s;
  }

  /* A device with nowhere to keep an id is not a device we can count. In the
     SharePoint srcdoc iframe every storage call throws, so a fresh random id
     per page load would report ten "devices" for ten opens and bury the real
     ones in noise. Collapse them all onto one reserved id instead: the log
     still shows the visit, and it shows honestly that we cannot tell who. */
  var NOSTORE = '00000000';
  var iid = sget(K_ID);
  if (!storeOK) {
    iid = NOSTORE;
  } else if (!iid || !/^[0-9a-f]{8}$/.test(iid)) {
    iid = newId();
    if (!sset(K_ID, iid)) { iid = NOSTORE; }
  }
  var who = sget(K_WHO) || '';

  /* Where is this copy running from? This is the field that tells you who is
     about to get stuck on an old build. */
  function srcKind() {
    try {
      if (location.protocol !== 'file:') return 'web';
      var p = decodeURIComponent(location.pathname);
      return p.indexOf('ClearShift Tools') >= 0 ? 'shared' : 'local';
    } catch (e) { return '?'; }
  }

  /* ------------------------------------------------------------------ chrome */
  var HIDE_ID = 'skg-hide';
  var CSS = [
    /* keep the app invisible AND unclickable until a verdict exists. Not
       display:none — layout still has to happen so the app can measure itself. */
    'html.skg-wait{background:#050818}',
    'html.skg-wait body>*:not(.skg):not(.ski){visibility:hidden!important;pointer-events:none!important}',
    '.skg{position:fixed;inset:0;z-index:2147483100;display:grid;place-items:center;',
    '  background:radial-gradient(100% 80% at 50% 42%,#0A1130 0%,#050818 40%,#010206 72%,#000 100%);',
    '  font-family:"Segoe UI Variable Text","Segoe UI","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;',
    '  direction:rtl;color:#DCE6FF;-webkit-font-smoothing:antialiased}',
    '.skg.gone{opacity:0;transition:opacity .3s ease;pointer-events:none}',
    '.skg-box{width:min(92vw,430px);text-align:center;padding:0 20px}',
    '.skg-rule{height:1px;margin:0 auto 22px;width:min(58vmin,260px);',
    '  background:linear-gradient(90deg,transparent,rgba(138,169,255,.55),transparent)}',
    '.skg-h{font-size:19px;font-weight:640;letter-spacing:-.01em;color:#F2F6FF;margin:0 0 10px}',
    '.skg-p{font-size:14.5px;line-height:1.65;color:#93A8D6;margin:0}',
    '.skg-p.big{font-size:16px;color:#DCE6FF}',
    '.skg-f{margin-top:26px;font-size:11.5px;letter-spacing:.06em;color:#4C5F8C}',
    '.skg-row{margin-top:18px;display:flex;gap:8px;justify-content:center}',
    '.skg-in{flex:1;min-width:0;padding:11px 13px;border-radius:9px;text-align:right;',
    '  background:rgba(255,255,255,.05);border:1px solid rgba(138,169,255,.28);',
    '  color:#F2F6FF;font:inherit;font-size:15px;outline:none}',
    '.skg-in:focus{border-color:#2F55E8;background:rgba(47,85,232,.12)}',
    '.skg-b{padding:11px 20px;border-radius:9px;border:0;cursor:pointer;font:inherit;',
    '  font-size:14.5px;font-weight:640;background:#2F55E8;color:#fff}',
    '.skg-b:hover{background:#4468F5}',
    '.skg-err{margin-top:9px;font-size:12.5px;color:#E0796F;min-height:16px}',
    '.skg-dots{margin-top:14px;font-size:12.5px;color:#4C5F8C;letter-spacing:.08em}',
    '@media (prefers-reduced-motion:reduce){.skg,.skg *{transition:none!important}}'
  ].join('\n');

  var st = document.createElement('style');
  st.id = HIDE_ID;
  st.textContent = CSS;
  (document.head || document.documentElement).appendChild(st);
  document.documentElement.classList.add('skg-wait');

  var cover = null;
  function mkCover() {
    if (cover) return cover;
    cover = document.createElement('div');
    cover.className = 'skg';
    cover.style.opacity = '0';
    /* invisible but still on top: without this it would swallow the click that
       skips the intro */
    cover.style.pointerEvents = 'none';
    var box = document.createElement('div');
    box.className = 'skg-box';
    cover.appendChild(box);
    cover._box = box;
    (document.body || document.documentElement).appendChild(cover);
    return cover;
  }
  /* build a panel out of textContent only — never innerHTML, anywhere */
  function paint(parts) {
    var c = mkCover(), box = c._box, i, p, el;
    while (box.firstChild) box.removeChild(box.firstChild);
    var rule = document.createElement('div'); rule.className = 'skg-rule';
    box.appendChild(rule);
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      el = document.createElement(p.t || 'div');
      if (p.c) el.className = p.c;
      if (p.x != null) el.textContent = p.x;
      if (p.f) p.f(el);
      box.appendChild(el);
    }
    c.style.opacity = '1';
    c.style.pointerEvents = 'auto';
    return box;
  }
  function reveal() {
    document.documentElement.classList.remove('skg-wait');
    if (cover) {
      cover.classList.add('gone');
      setTimeout(function () { if (cover && cover.parentNode) cover.parentNode.removeChild(cover); }, 320);
    }
  }

  /* --------------------------------------------------------------- telemetry */
  /* An <img> beacon, deliberately: an image request is not subject to CORS at
     all, so the log endpoint needs no permissive headers and we never read a
     response. Nothing comes back into the page. */
  function ping(ev, label) {
    if (!CFG.log) return;
    try {
      var q = '?ev=' + encodeURIComponent(ev) +
              '&tool=' + encodeURIComponent(CFG.tool) +
              '&ver=' + encodeURIComponent(CFG.verS) +
              '&iid=' + encodeURIComponent(iid) +
              '&who=' + encodeURIComponent(who) +
              '&src=' + encodeURIComponent(srcKind()) +
              (label ? '&x=' + encodeURIComponent(String(label).slice(0, 40)) : '') +
              '&t=' + (new Date()).getTime();
      var im = new Image();
      im.referrerPolicy = 'no-referrer';
      im.src = CFG.log + q;
    } catch (e) {}
  }

  /* ---------------------------------------------------------------- decision */
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  /* Rebuild a known-shape object from the response. Nothing from the wire is
     kept by reference, merged, or trusted for its type. */
  function sanitize(txt) {
    var o = JSON.parse(txt), out = { all: 0, msg: 1, min: 0, k: [], dev: [] }, t, i, n;
    if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
    if (o.all === 2) out.all = 2;
    if (o.msg === 2) out.msg = 2;
    if (o.tools && typeof o.tools === 'object' && has(o.tools, CFG.tool)) {
      t = o.tools[CFG.tool];
      if (t && typeof t === 'object' && !Array.isArray(t)) {
        if (typeof t.min === 'number' && isFinite(t.min)) out.min = t.min | 0;
        if (Array.isArray(t.k)) {
          for (i = 0; i < t.k.length && out.k.length < 60; i++) {
            n = t.k[i];
            if (typeof n === 'number' && isFinite(n)) out.k.push(n | 0);
          }
        }
      }
    }
    if (Array.isArray(o.dev)) {
      for (i = 0; i < o.dev.length && out.dev.length < 800; i++) {
        if (typeof o.dev[i] === 'string' && /^[0-9a-f]{8}$/.test(o.dev[i])) out.dev.push(o.dev[i]);
      }
    }
    return out;
  }

  function verdictFrom(g) {
    if (g.dev.indexOf(iid) >= 0) return { ok: false, code: 2 };   /* this device */
    if (g.all === 2)             return { ok: false, code: g.msg }; /* everything */
    if (VER > 0 && g.min && VER < g.min) return { ok: false, code: 1 };
    if (VER > 0 && g.k.indexOf(VER) >= 0) return { ok: false, code: 1 };
    return { ok: true, code: 0 };
  }

  /* offline brake: only the build date, and only after the grace window */
  function localVerdict() {
    var last = sget(K_OK), now = (new Date()).getTime(), d, age;
    if (last && /^[0-9]{1,15}$/.test(last) &&
        (now - parseInt(last, 10)) < CFG.ttl * 3600e3) return { ok: true, code: 0 };
    if (/^\d{4}-\d{2}-\d{2}$/.test(CFG.built)) {
      d = Date.parse(CFG.built + 'T00:00:00');
      if (isFinite(d)) {
        age = (now - d) / 86400e3;
        if (age > CFG.maxAge) return { ok: false, code: 1 };
      }
    }
    return { ok: true, code: 0 };   /* fail-open */
  }

  function ask() {
    return new Promise(function (res) {
      if (/[?&]nocheck=1\b/.test(location.search)) return res({ ok: true, code: 0 });
      if (!CFG.gate || !window.fetch) return res(localVerdict());

      var ctl = null, killed = false;
      try { ctl = new AbortController(); } catch (e) {}
      var giveUp = setTimeout(function () {
        killed = true;
        try { if (ctl) ctl.abort(); } catch (e) {}
        res(localVerdict());
      }, CFG.wait);

      var url = CFG.gate + (CFG.gate.indexOf('?') < 0 ? '?' : '&') +
                't=' + (new Date()).getTime();
      var opt = { cache: 'no-store', redirect: 'follow', referrerPolicy: 'no-referrer' };
      if (ctl) opt.signal = ctl.signal;

      fetch(url, opt).then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.text();
      }).then(function (txt) {
        if (killed) return;
        clearTimeout(giveUp);
        if (txt.length > 2048) throw new Error('too big');   /* cap before parse */
        var g = sanitize(txt);
        if (!g) throw new Error('shape');
        var v = verdictFrom(g);
        if (v.ok) sset(K_OK, String((new Date()).getTime()));
        res(v);
      })['catch'](function () {
        if (killed) return;
        clearTimeout(giveUp);
        res(localVerdict());   /* unreachable, 404, garbage -> fail open */
      });
    });
  }

  /* ------------------------------------------------------------------- intro */
  function onReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn, false);
    } else { fn(); }
  }

  /* Resolves when the SK intro is done — or straight away when it is not
     playing at all. data-once="session" makes sk-intro skip play() entirely,
     and in that case it never fires sk-intro:done, so waiting on the event
     alone would hang the gate for its whole safety timeout. */
  function introDone() {
    return new Promise(function (res) {
      var settled = false;
      function fin() { if (!settled) { settled = true; res(); } }
      document.addEventListener('sk-intro:done', fin, false);
      if (!window.SKIntro) { onReady(fin); return; }
      onReady(function () {
        setTimeout(function () { if (!document.querySelector('.ski')) fin(); }, 150);
      });
      setTimeout(fin, 12000);
    });
  }

  /* -------------------------------------------------------------- enrollment */
  function enroll() {
    return new Promise(function (res) {
      if (!storeOK) return res();          /* nowhere to keep it — don't nag */
      if (who) return res();

      var listId = 'skg-team';
      var box = paint([
        { c: 'skg-h', x: 'מה השם שלך? (בעברית)' },
        { c: 'skg-p', x: 'פעם אחת בלבד, לכל הכלים על המכשיר הזה.' }
      ]);

      var row = document.createElement('div'); row.className = 'skg-row';
      var inp = document.createElement('input');
      inp.className = 'skg-in';
      inp.type = 'text';
      inp.setAttribute('list', listId);
      inp.setAttribute('autocomplete', 'off');
      inp.setAttribute('spellcheck', 'false');
      inp.maxLength = 40;
      inp.placeholder = 'התחל להקליד…';

      var dl = document.createElement('datalist');
      dl.id = listId;
      for (var i = 0; i < TEAM.length; i++) {
        var op = document.createElement('option');
        op.value = TEAM[i];
        dl.appendChild(op);
      }

      var btn = document.createElement('button');
      btn.className = 'skg-b';
      btn.type = 'button';
      btn.textContent = 'המשך';

      row.appendChild(inp); row.appendChild(btn);
      box.appendChild(row); box.appendChild(dl);

      var err = document.createElement('div'); err.className = 'skg-err';
      box.appendChild(err);

      var foot = document.createElement('div');
      foot.className = 'skg-f';
      foot.textContent = 'מזהה מכשיר ' + iid;
      box.appendChild(foot);

      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);

      function go() {
        var v = inp.value.replace(/\s+/g, ' ').trim();
        /* Hebrew letters, space, hyphen, geresh. Own-goal injection is as easy
           as any other, so the user's own input is validated too. */
        if (v.length < 2 || v.length > 40 || !/^[א-ת][א-ת '׳-]*$/.test(v)) {
          err.textContent = 'נא להקליד שם בעברית';
          try { inp.focus(); } catch (e) {}
          return;
        }
        who = v;
        sset(K_WHO, who);
        ping('join');
        res();
      }
      btn.addEventListener('click', go, false);
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); go(); }
      }, false);
    });
  }

  /* Make the device id readable off a screenshot: the build stamp already sits
     in the top bar of every tool, so the id goes next to it. */
  function stampId() {
    try {
      var e = document.querySelector('.ver');
      if (e && e.textContent.indexOf(iid) < 0) {
        e.textContent = e.textContent + ' · ' + iid;
        if (e.title) e.title = e.title + ' — מזהה מכשיר ' + iid;
      }
    } catch (x) {}
  }

  /* -------------------------------------------------------------------- flow */
  var resolveReady;
  var ready = new Promise(function (r) { resolveReady = r; });

  var asking = ask();          /* fires immediately, in parallel with the intro */
  var waiting = introDone();

  /* Dead-man switch. If 20s pass with nothing painted and nothing decided, the
     gate is what is broken — let the person work. It fires only in limbo: a
     real block has painted a panel by then and is left alone. */
  setTimeout(function () {
    if (cover && cover._box && cover._box.firstChild) return;
    document.documentElement.classList.remove('skg-wait');
    if (cover && cover.parentNode) cover.parentNode.removeChild(cover);
  }, 20000);

  /* if the answer is late, say so rather than showing a frozen logo */
  var slow = setTimeout(function () {
    if (!document.querySelector('.skg-dots')) {
      var box = mkCover()._box;
      if (!box.firstChild) {
        paint([{ c: 'skg-dots', x: 'מאמת גרסה…' }]);
      }
    }
  }, 5200);

  Promise.all([asking, waiting]).then(function (r) {
    clearTimeout(slow);
    var v = r[0];

    if (!v.ok) {
      ping('block');
      paint([
        { c: 'skg-h', x: 'הממשק אינו זמין' },
        { c: 'skg-p big', x: MSG[v.code] || MSG[2] },
        { c: 'skg-f', x: CFG.tool + ' · ' + CFG.verS + ' · מזהה מכשיר ' + iid }
      ]);
      resolveReady(false);
      return;
    }

    enroll().then(function () {
      stampId();
      ping('open');
      reveal();
      resolveReady(true);
    });
  })['catch'](function () {
    /* the gate itself must never be what breaks a tool */
    clearTimeout(slow);
    reveal();
    resolveReady(true);
  });

  window.SKGate = {
    ready : ready,
    use   : function (label) { ping('use', label); },
    get id()  { return iid; },
    get who() { return who; },
    forget: function () { sdel(K_WHO); sdel(K_ID); sdel(K_OK); },
    config: CFG
  };
})();

</script><!--/SKGATE-->

<script>
(function(){

  var logoEl = document.getElementById('logo');
  logoEl.style.webkitMask = 'url("' + LOGO + '") no-repeat center/contain';
  logoEl.style.mask = 'url("' + LOGO + '") no-repeat center/contain';

  var I = {
    activity:'<path d="M3 21h18"/><path d="M6.5 21v-8"/><path d="M11.5 21V6"/><path d="M16.5 21v-5"/><path d="M21 21V10"/>',
    book:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A2 2 0 0 1 11 3.5h2A2 2 0 0 1 15 5.5V7"/><path d="M3 12.5h18"/>',
    sign:'<path d="M3 17.5c3.2 0 3.8-9.5 6.6-9.5 2.4 0 1.7 7 3.9 7 1.7 0 1.8-3.4 3.4-3.4 1.2 0 1.4 1.7 2.6 1.7"/><path d="M3 21h18"/>',
    ticket:'<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h11A2.5 2.5 0 0 1 20 8.5v1.6a2 2 0 0 0 0 3.8v1.6A2.5 2.5 0 0 1 17.5 18h-11A2.5 2.5 0 0 1 4 15.5v-1.6a2 2 0 0 0 0-3.8z"/><path d="M12 7v10" stroke-dasharray="2 3"/>',
    percent:'<path d="M18.5 5.5 5.5 18.5"/><circle cx="8" cy="8" r="2.6"/><circle cx="16" cy="16" r="2.6"/>'
  };

  var H = {
    hebActivity:'תמונת פעילות לקוח',
    hebActivityHint:'אקסל הזמנות לדשבורד פעילות',
    hebBook:'תיק לקוחות',
    hebBookHint:'תמונת מצב וניטור הזדמנויות',
    hebSign:'הכנת מסמכים Zoho Sign',
    hebSignHint:'נסח למסמכי פתיחת לקוח מלאים',
    hebTicketHint:'מדרגות שוברים וחיוב בשקלים',
    hebFees:'פירוט עמלות',
    hebFeesHint:'ספרד ליום וחשבונית יואן',
    deskOnly:'ממחשב בלבד'
  };

  // a local tool's href is its bare file name: the launcher ships INTO
  // "ClearShift Tools" and sits beside them, so a relative link keeps working
  // after the folder syncs onto somebody else's machine.
  // gid is the tool's SK Gate id (clearshift-gate\targets.json). Every coin
  // reports which tool it opened, so the usage log answers "who opened what"
  // per tool and not only "somebody opened the launcher".
  var APPS = [
    {gid:'b3', slug:'activity', name:H.hebActivity, hint:H.hebActivityHint, icon:'activity',
     href:'DYNAMICS - תמונת פעילות לקוח.html'},
    {gid:'g6', slug:'portfolio', name:H.hebBook, hint:H.hebBookHint, icon:'book',
     href:'DYNAMICS - תמונת מצב תיק לקוחות.html'},
    {gid:'a7', slug:'zoho', name:H.hebSign, hint:H.hebSignHint, icon:'sign',
     href:'ZOHO SIGN - מסמכים לחתימה.html'},
    {gid:'f4', slug:'voucher', name:'Voucher Master', hint:H.hebTicketHint, icon:'ticket',
     href:'https://skuznitsky-clearshift.github.io/vm/', web:true},
    {gid:'e2', slug:'fees', name:H.hebFees, hint:H.hebFeesHint, icon:'percent',
     href:'https://skuznitsky-clearshift.github.io/fees/', web:true}
  ];

  // The hosted build (build.ps1 -Web) is the phone door: it carries only the
  // two tools that are real websites. The three local tools cannot be reached
  // from a phone at all, and an https page cannot open a file:// link even on a
  // desktop, so listing them here would only be a promise the page cannot keep.
  if (true) { APPS = APPS.filter(function(a){ return a.web; }); }

  // ---------------------------------------------------------- embedded tools
  // The single-file build (build.ps1 -One) carries each local tool as base64 in
  // a <script type="application/octet-stream">. Base64 cannot contain "<", so
  // there is nothing to escape and no way for a tool's own markup to close the
  // block early - which is exactly what a naive string literal would do.
  var ONE_FILE = false;

  function embedded(gid) { return !!document.getElementById('t-' + gid); }

  function toolHtml(gid) {
    var el = document.getElementById('t-' + gid);
    if (!el) return null;
    var bin = atob(el.textContent.replace(/\s+/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  var frame  = document.getElementById('frame');
  var fview  = document.getElementById('fview');
  var ftitle = document.getElementById('ftitle');

  // Served by the local engine, this page is on http://localhost - and so the
  // documents tool it serves at "/" is same-origin. That copy is the fuller
  // one: it has the automatic osek and GuideStar verification, which no page
  // can do on its own. Point the frame straight at it.
  //
  // Detecting the engine from a file:// page was tried and cannot work -
  // browsers refuse a file:// page's requests to http, so the probe always
  // failed and the coin always fell back. Being served BY the engine is the
  // signal, and it needs no probing.
  var ENGINE_HOST = (location.protocol === 'http:' &&
                     (location.hostname === 'localhost' || location.hostname === '127.0.0.1'));

  function openTool(app) {
    if (app.gid === 'a7' && ENGINE_HOST) {
      ftitle.textContent = app.name;
      fview.removeAttribute('srcdoc');
      fview.src = '/';
      frame.hidden = false;
      document.body.style.overflow = 'hidden';
      document.getElementById('fback').focus();
      return;
    }
    showTool(app);
  }

  function showTool(app) {
    ftitle.textContent = app.name;
    fview.removeAttribute('src');
    fview.srcdoc = toolHtml(app.gid);
    frame.hidden = false;
    document.body.style.overflow = 'hidden';
    document.getElementById('fback').focus();
  }
  function closeTool() {
    frame.hidden = true;
    fview.srcdoc = '';           // stop the tool rather than leave it running
    document.body.style.overflow = '';
  }
  document.getElementById('fback').addEventListener('click', closeTool);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !frame.hidden) closeTool();
  });

  var dial  = document.getElementById('dial');
  var hub   = document.getElementById('hub');
  var wrap  = document.getElementById('coins');
  var ring1 = dial.querySelector('.ring1');
  var ring2 = dial.querySelector('.ring2');
  var hint  = document.getElementById('hint');
  var coins = [];

  // "on a phone" is not the same question as "is the window narrow". a local
  // file:// tool is unreachable from a phone whatever the width, and a narrow
  // desktop window still opens it fine.
  var onPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                (navigator.maxTouchPoints > 1 && !/Windows/i.test(navigator.userAgent));
  var fromFile = location.protocol === 'file:';

  APPS.forEach(function(app, i){
    var reachable = app.web || !onPhone || fromFile;
    var a = document.createElement('a');
    a.className = 'coin' + (reachable ? '' : ' off');
    // nointro=1: the signature plays once, here, on the way in. Every tool
    // opened from a coin skips it (sk-intro.js honours the flag, and tools
    // built before that change carry the same stub, injected by
    // sk-intro\inject-nointro.ps1).
    var href = app.web ? app.href : encodeURI(app.href);
    // via=apps is what the tools check for: opened from an old shortcut they
    // show a card pointing back here instead of running. A front door, not a
    // lock - see inject-via.ps1.
    var flags = 'via=apps&nointro=1';
    // open the launcher itself with ?nocheck=1 and every tool it opens inherits
    // it. nocheck is the gate's own override, so this is the way to keep working
    // while a version is dropped for everybody else - one shortcut, not five.
    if (/[?&]nocheck=1\b/.test(location.search)) flags += '&nocheck=1';
    a.href = href + (href.indexOf('?') < 0 ? '?' : '&') + flags;
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.animationDelay = (140 + i * 70) + 'ms';
    a.innerHTML =
      '<span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true">' + I[app.icon] + '</svg></span>' +
      '<span class="name">' + app.name +
      '<span class="why">' + H.deskOnly + '</span></span>';
    a.setAttribute('aria-label', app.name + ' — ' + app.hint);
    if (ONE_FILE && !app.web && embedded(app.gid)) {
      // the tool travels inside this file, so nothing is opened from disk
      a.addEventListener('click', function(e){
        e.preventDefault();
        try { if (window.SKGate && SKGate.use) SKGate.use('open:' + app.gid + ' ' + app.slug); }
        catch (err) {}
        openTool(app);
      });
    } else if (!reachable) {
      a.addEventListener('click', function(e){ e.preventDefault(); });
    } else {
      // the gate's own beacon reports that the launcher was opened; this adds
      // which coin was pressed. It is an <img> request, so it does not delay
      // the navigation, and the launcher stays open behind the new tab anyway.
      a.addEventListener('click', function(){
        try {
          if (window.SKGate && SKGate.use) SKGate.use('open:' + app.gid + ' ' + app.slug);
        } catch (err) {}
      });
    }
    a.addEventListener('mouseenter', function(){ showHint(app.hint); });
    a.addEventListener('focus',      function(){ showHint(app.hint); });
    a.addEventListener('mouseleave', hideHint);
    a.addEventListener('blur',       hideHint);
    wrap.appendChild(a);
    coins.push(a);
  });

  function showHint(t){ hint.textContent = t; hint.classList.add('on'); }
  function hideHint(){ hint.classList.remove('on'); }

  // the dial is an ellipse, not a circle: a browser window is far wider than it
  // is tall, and a true circle either overflows the bottom or leaves the sides
  // empty.
  function layout(){
    var W = window.innerWidth, H2 = window.innerHeight;
    var narrow = W < 720 || H2 < 520;
    document.body.classList.toggle('narrow', narrow);
    if (narrow) {
      dial.style.width = dial.style.height = '';
      hub.style.width = hub.style.height = '150px';
      sizeLogo(150);
      coins.forEach(function(el){ el.style.left = el.style.top = ''; });
      return;
    }

    var rx = Math.max(190, Math.min(330, W / 2 - 180));
    var ry = Math.max(150, Math.min(250, H2 / 2 - 140));
    var hubD = Math.round(Math.min(232, Math.max(160, Math.min(rx, ry) * 1.25)));

    dial.style.width  = (rx * 2) + 'px';
    dial.style.height = (ry * 2) + 'px';
    hub.style.width = hub.style.height = hubD + 'px';
    sizeLogo(hubD);

    sizeRing(ring1, rx * 2, ry * 2);
    sizeRing(ring2, hubD + (rx - hubD / 2) * 0.86, hubD + (ry - hubD / 2) * 0.86);

    coins.forEach(function(el, i){
      // two coins read as a pair when they flank the medallion; starting at the
      // top the way five do would stack them above and below it instead.
      var start = (coins.length === 2) ? 0 : -90;
      var ang = (start + i * (360 / coins.length)) * Math.PI / 180;
      el.style.left = (rx + Math.cos(ang) * rx) + 'px';
      el.style.top  = (ry + Math.sin(ang) * ry) + 'px';
    });
  }
  function sizeLogo(hubD){
    var w = Math.round(hubD * 0.62);
    logoEl.style.width = w + 'px';
    logoEl.style.height = Math.round(w / 3.52) + 'px';
  }
  function sizeRing(el, w, h){
    el.style.width = w + 'px'; el.style.height = h + 'px';
  }

  // arrow keys walk the dial, Enter opens - a launcher should not need a mouse.
  document.addEventListener('keydown', function(e){
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var at = coins.indexOf(document.activeElement);
    var step = (e.key === 'ArrowLeft') ? 1 : -1;
    var next = (at < 0) ? 0 : (at + step + coins.length) % coins.length;
    coins[next].focus();
    e.preventDefault();
  });

  window.addEventListener('resize', layout);
  layout();
})();
</script>
