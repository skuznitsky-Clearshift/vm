<!doctype html>

<!--SKVIA--><script>
/* ============================================================================
   ClearShift Apps — "open me from the launcher" guard
   ----------------------------------------------------------------------------
   Injected into a tool by inject-via.ps1. A tool opened straight from an old
   shortcut replaces itself with a card pointing at ClearShift Apps; a tool
   opened from a coin carries ?via=apps and runs normally.

   This is a front door, not a lock. Anyone who types the flag gets in - the
   point is that the team lands on the launcher and sees the whole set, not
   that a tool is protected from them.

   ?nocheck=1 passes too: it is the gate's own override, and the launcher
   forwards it to every coin, so one shortcut keeps working while the rest of
   the team is being moved across.

   Implementation note, learned the hard way: document.open() is IGNORED when it
   is called from a script the parser is currently running, so the obvious
   open/write/close replacement silently did nothing and the tool rendered as
   normal. The document is replaced at DOMContentLoaded instead, with the page
   held invisible until then so there is no flash of the tool underneath.
   ==========================================================================*/
(function () {
  'use strict';
  var q = location.search || '';
  if (/[?&]via=apps\b/.test(q) || /[?&]nocheck=1\b/.test(q)) return;

  var HOME = 'https://skuznitsky-clearshift.github.io/vm/apps/';

  var hide = document.createElement('style');
  hide.setAttribute('data-skvia', '1');
  hide.textContent = 'html{visibility:hidden!important}';
  (document.head || document.documentElement).appendChild(hide);

  var CSS =
'html{visibility:visible!important}' +
'html,body{height:100%}' +
'body{margin:0;background:#0b0d10;color:#e9e7e2;display:flex;align-items:center;' +
'justify-content:center;text-align:center;overflow:hidden;' +
'font:15px/1.7 "Segoe UI Variable Text","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}' +
'.skvia{max-width:390px;padding:28px}' +
'.skvia .r{width:74px;height:74px;margin:0 auto 22px;border-radius:50%;' +
'border:1px solid #5fb4d6;display:flex;align-items:center;justify-content:center}' +
'.skvia .r i{display:block;width:19px;height:19px;border-right:1.6px solid #5fb4d6;' +
'border-bottom:1.6px solid #5fb4d6;transform:rotate(45deg);margin-left:-6px}' +
'.skvia h1{margin:0 0 10px;font-size:17px;font-weight:600;letter-spacing:-.01em;color:#f2f4f7}' +
'.skvia p{margin:0 0 24px;font-size:13.5px;color:#8e939b}' +
'.skvia a{display:inline-block;text-decoration:none;font-size:13.5px;color:#0b0d10;' +
'background:#5fb4d6;border-radius:8px;padding:9px 22px}' +
'.skvia small{display:block;margin-top:26px;font-size:11px;letter-spacing:.2em;' +
'color:#4e545d;direction:ltr}';

  function render() {
    document.title = 'ClearShift Apps';
    document.head.innerHTML = '';
    var st = document.createElement('style');
    st.textContent = CSS;
    document.head.appendChild(st);

    var box = document.createElement('div');
    box.className = 'skvia';

    var ring = document.createElement('div');
    ring.className = 'r';
    ring.appendChild(document.createElement('i'));

    var h = document.createElement('h1');
    h.textContent = 'הכלים נפתחים מתוך ClearShift Apps';

    var p = document.createElement('p');
    p.textContent = 'הקיצור הישן הזה כבר לא בשימוש. פתחו את ClearShift Apps ' +
                    'ובחרו את הכלי משם — כך תמיד תקבלו את הגרסה העדכנית.';

    var a = document.createElement('a');
    a.href = HOME;
    a.textContent = 'פתיחת ClearShift Apps';

    var s = document.createElement('small');
    s.textContent = 'SK PRODUCTS';

    box.appendChild(ring); box.appendChild(h); box.appendChild(p);
    box.appendChild(a); box.appendChild(s);

    document.body.innerHTML = '';
    document.body.setAttribute('dir', 'rtl');
    document.body.appendChild(box);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();

</script><!--/SKVIA-->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voucher Master">
</head>
<body style="margin:0">
<title>VOUCHER MASTER</title>
<style>
/* רקע לבן בכל מצב — הכלי לא מתחלף למצב כהה גם אם המכשיר מוגדר כהה.
   הקווים והמילויים האפורים הם מה שנותן את ההיררכיה על גבי הלבן. */
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  --bg:#FFFFFF; --card:#FFFFFF; --soft:#F4F5F7;
  --ink:#16181D; --ink-2:#5A616C; --ink-3:#8A919C;
  --line:#E2E5EA; --line-2:#C9CED5;
  --brand:#1F4A6B; --brand-2:#2E7FB8; --brand-soft:#EAF1F6; --brand-fg:#FFFFFF;
  --ok:#2C6A4C; --ok-soft:#E5F0EA;
  --hold:#8A6410; --hold-soft:#F7F0DE;
  --c1:#2E7FB8; --c2:#1E8F86; --c3:#4E9A4A; --c4:#D19A17; --c5:#CC5A3A; --c6:#7A5FB0;
  --ui:"Segoe UI Variable Text","Segoe UI","Arial Hebrew","Noto Sans Hebrew",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
#app{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:15px;line-height:1.5;min-height:100vh;padding:0 0 40px}
.wrap{max-width:660px;margin:0 auto;padding:0 18px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;
  unicode-bidi:isolate;display:inline-block}

/* ---- לשוניות ---- */
.tabs{display:flex;justify-content:center;gap:6px;padding:16px 18px 0}
.tabs button{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--ink-3);
  padding:8px 16px;border-radius:999px;min-height:38px}
.tabs button:hover{color:var(--ink-2);background:var(--soft)}
/* על רקע לבן הלשונית הפעילה מסומנת בקו ובצל, לא במילוי */
.tabs button.on{background:var(--card);border-color:var(--line-2);color:var(--ink);
  box-shadow:0 1px 3px rgba(22,24,29,.1)}
.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---- הכותרת ---- */
.hero{text-align:center;padding:34px 0 4px}
@media (max-width:520px){.hero{padding:24px 0 4px}}
.mark{font-family:var(--mono);font-weight:700;font-size:clamp(26px,8.5vw,46px);
  letter-spacing:.16em;line-height:1;white-space:nowrap;margin:0}
/* אות בצבע אחר, במחזור של שישה גוונים בעלי אותה בהירות ורוויה —
   ככה זה נקרא כמערכת אחת ולא כקונפטי. זה מקור הצבע היחיד בדף. */
.mark .l1{color:var(--c1)} .mark .l2{color:var(--c2)} .mark .l3{color:var(--c3)}
.mark .l4{color:var(--c4)} .mark .l5{color:var(--c5)} .mark .l6{color:var(--c6)}
.mark .sp{display:inline-block;width:.42em}
.mark-sub{margin-top:11px;font-size:12px;letter-spacing:.22em;color:var(--ink-3);
  font-weight:600;text-transform:uppercase}

/* ---- שורת החיפוש ---- */
.line{display:flex;align-items:center;gap:12px;margin:22px auto 0;max-width:520px;
  background:var(--card);border:1px solid var(--line-2);border-radius:999px;
  padding:6px 20px 6px 8px;box-shadow:0 1px 3px rgba(0,0,0,.05);
  transition:box-shadow .15s,border-color .15s}
.line:focus-within{box-shadow:0 2px 10px rgba(0,0,0,.09);border-color:var(--brand)}
.line .cap{font-size:13.5px;color:var(--ink-2);font-weight:600;white-space:nowrap;flex:none}
.line input{flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;
  color:var(--ink);padding:9px 0;direction:ltr;text-align:right;min-height:34px}
.line input::placeholder{color:var(--ink-3);font-size:16px}
.line.txt input{font-family:var(--ui);font-size:16px;direction:rtl;text-align:right}
.line .unit{font-family:var(--mono);color:var(--ink-3);font-size:16px;flex:none;
  padding-inline-start:4px}

/* ---- שורת בחירה ---- */
.opts{display:flex;justify-content:center;gap:7px;margin-top:14px;flex-wrap:wrap}
.opts label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border:1px solid var(--line-2);border-radius:999px;padding:7px 15px;font-size:13.5px;
  background:var(--card);min-height:38px;transition:border-color .12s,background .12s}
.opts label:hover{border-color:var(--ink-3)}
.opts label.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.opts input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;margin:0}
.opts.tight label{padding:6px 12px;font-size:12.5px;min-height:34px}
.opts.tight .amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* כותרת מעל שורת בחירה — אותה טיפוגרפיה של כותרת המשנה שמתחת ללוגו */
.opthd{margin:20px 0 0;text-align:center;font-size:12px;letter-spacing:.22em;
  color:var(--ink-3);font-weight:600;text-transform:uppercase}
.opthd+.opts{margin-top:9px}

.when{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.when input{font-family:var(--ui);font-size:15px;border:1px solid var(--line-2);
  border-radius:9px;padding:8px 11px;background:var(--card);color:var(--ink);min-height:40px}
.when input:focus{outline:2px solid var(--brand);outline-offset:-1px}

/* ---- תוצאה ---- */
.res{margin:26px auto 0;max-width:520px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden}
.res-top{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.res-top .k{font-size:11px;letter-spacing:.11em;color:var(--ink-3);font-weight:700;text-transform:uppercase}
.res-top .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:650;
  direction:ltr;unicode-bidi:isolate}
.res-top .d{font-size:12px;color:var(--ink-3)}
.res-b{padding:16px 18px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;font-size:14.5px}
.row+.row{border-top:1px dashed var(--line)}
.row .k{color:var(--ink-2)}
.row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:560;
  direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.row.tot{border-top:1.5px solid var(--line-2);margin-top:6px;padding-top:13px}
.row.tot .k{font-weight:660;color:var(--ink)}
.row.tot .v{font-size:clamp(26px,7.5vw,34px);font-weight:700;letter-spacing:-.025em;color:var(--brand)}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.65;margin-top:12px}
/* נוסחה נקראת משמאל לימין — בלי בידוד היא מתהפכת בתוך בלוק RTL */
.hint.eq{font-family:var(--mono);direction:ltr;text-align:right;unicode-bidi:isolate}
.flag{display:flex;gap:9px;align-items:flex-start;border-radius:11px;padding:11px 13px;
  font-size:12.5px;line-height:1.6;margin-top:14px}
.flag.hold{background:var(--hold-soft);color:var(--ink-2)}
.flag.hold b{color:var(--hold)}
.flag.ok{background:var(--ok-soft);color:var(--ink-2)}
.flag.ok b{color:var(--ok)}
.flag.bad{background:#FBE9E7;color:var(--ink-2)}
.flag.bad b{color:#9E2F27}
.pip{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.flag.hold .pip{background:var(--hold)} .flag.ok .pip{background:var(--ok)}
.flag.bad .pip{background:#9E2F27}
.empty{text-align:center;color:var(--ink-3);font-size:13.5px;margin-top:26px}

/* ---- הבלוק שמצלמים ----
   תמיד בהיר, גם במצב כהה — זה יוצא כצילום מסך ללקוח. */
.shotwrap{margin:24px auto 0}

/* מצב צילום: הבלוק לבד על כל המסך, מוגדל כמה שנכנס.
   כך צילום מסך אחד בטלפון תופס אותו שלם ובגודל קריא. */
.cap-mode{position:fixed;inset:0;z-index:120;background:#EDEFF2;
  display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
.cap-mode .shot{transform-origin:center center}
/* כפתור הסגירה נעלם אחרי רגע, כדי שלא ייכנס לצילום המסך של הלקוח.
   הקשה על הרקע סוגרת בכל מצב. */
.cap-x{position:fixed;top:10px;left:10px;z-index:121;font-family:var(--ui);
  font-size:13px;font-weight:600;border:1px solid #C7CCD3;background:#FFFFFF;color:#16181D;
  border-radius:999px;padding:8px 16px;min-height:38px;cursor:pointer;opacity:.9;
  transition:opacity .5s}
.cap-x.gone{opacity:0;pointer-events:none}
.cap-tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:121;
  font-family:var(--ui);font-size:12.5px;color:#4A515C;background:rgba(255,255,255,.9);
  border-radius:999px;padding:6px 14px;transition:opacity .5s}
.cap-tip.gone{opacity:0}
/* ---- הדפסה / שמירה כ-PDF ----
   עמוד A4 אחד בלבד. שני הבאגים שהיו כאן: #app נשאר עם min-height:100vh ועוד
   40px ריפוד תחתון, מה שדחף עמוד שני ריק; והכרטיס נשאר ברוחב 520px ולא מילא
   את העמוד. הגדלים כאן ב-pt כי px על A4 יוצא זעיר. */
@media print{
  @page{size:A4;margin:14mm 15mm}
  html,body{background:#fff !important;height:100%}
  #app{min-height:0 !important;height:100%;padding:0 !important;background:#fff !important}
  #view{height:100%}
  .wrap{max-width:none !important;padding:0 !important;margin:0 !important;height:100%}
  #app>.tabs,.hero,.line,.opts,.opthd,.when,.foot,.acts,.cap-x,.cap-tip,.toast{display:none !important}
  .cap-mode{position:static !important;inset:auto !important;display:block !important;
    background:#fff !important;padding:0 !important;overflow:visible !important;z-index:auto !important}
  .shotwrap{margin:0 !important;overflow:visible !important;height:100%}
  /* עמודת flex בגובה העמוד: החלק העליון שומר על הקצב שלו, ובלוק החתימה
     נדחף לתחתית עם margin-top:auto. כך העמוד מתמלא בלי מרווחים קבועים
     שעלולים לגלוש לעמוד שני. */
  .shot{max-width:none !important;width:100% !important;margin:0 !important;
    border:0 !important;border-radius:0 !important;padding:0 !important;
    transform:none !important;box-shadow:none !important;font-size:12pt;
    height:100%;display:flex;flex-direction:column}
  .shot .logo{margin-bottom:12mm}
  .shot .logo img{height:12mm}
  .shot h3{font-size:23pt;margin-bottom:2.5mm}
  .shot .lede{font-size:12.5pt;margin-bottom:13mm}
  .shot table{font-size:15pt}
  .shot .pk th{font-size:11.5pt;padding-bottom:7mm}
  .shot .pk td{font-size:19pt}
  .shot .pk td.fit{font-size:12pt;padding-top:4mm}
  .shot .valid{font-size:12.5pt;margin-top:13mm}
  .shot hr{margin:13mm 0}
  .shot .frm th,.shot .frm td{font-size:15pt;padding:3.4mm 0}
  .shot .undertake{font-size:13.5pt;margin-top:11mm}
  .shot .tlink{font-size:13pt;margin-top:5mm}
  .shot .sigs{margin-top:auto !important;padding-top:16mm}
  .shot .sig .cap{font-size:12.5pt;margin-bottom:17mm}
  .shot .terms{font-size:10.5pt;margin-top:10mm}
}
.shot{background:#FFFFFF;color:#1A1D22;border:1px solid #D8DCE1;border-radius:14px;
  padding:20px 20px 18px;width:100%;max-width:520px;margin:0 auto;
  font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;transform-origin:top center}
.shot .logo{text-align:center;margin-bottom:14px}
.shot .logo img{height:26px}
.shot h3{margin:0 0 3px;font-size:16px;font-weight:700;text-align:center;color:#16181D}
.shot .lede{text-align:center;font-size:12px;color:#5A616C;margin:0 0 15px}
.shot table{width:100%;border-collapse:collapse;font-size:12.5px}
.shot .pk th{font-size:10.5px;letter-spacing:.06em;color:#6B727C;font-weight:700;
  padding:0 4px 5px;text-align:center;border:0}
.shot .pk td{padding:0 4px;text-align:center;border:0;font-weight:700;font-size:14px}
.shot .pk td.fit{font-weight:400;font-size:11px;color:#5A616C;padding-top:5px}
.shot .valid{text-align:center;font-size:11.5px;color:#5A616C;margin:12px 0 0}
.shot hr{border:0;border-top:1px solid #E3E5E9;margin:15px 0}
.shot .frm{font-size:13px}
.shot .frm th{text-align:right;font-weight:400;color:#5A616C;padding:3px 0;width:38%;border:0}
.shot .frm td{padding:3px 0;font-weight:700;border:0}
.shot .undertake{font-size:12px;line-height:1.6;margin:13px 0 0;color:#2C3138}
/* קישור לתנאי השירות. עובר כקישור לחיץ גם בהדפסה ל-PDF, כי זה עוגן אמיתי. */
.shot .tlink{margin:7px 0 0;font-size:12px}
.shot .tlink a{color:#1F7BC4;text-decoration:underline;text-underline-offset:2px}
.shot .sigs{display:flex;gap:16px;margin-top:18px}
.shot .sig{flex:1}
.shot .sig .cap{font-size:11px;color:#6B727C;margin-bottom:20px}
.shot .sig .rule{border-bottom:1px solid #1A1D22;height:0}
.shot .terms{font-size:10px;line-height:1.6;color:#7B828C;margin-top:15px}
.foot{max-width:520px;margin:16px auto 0;border-top:1px dashed var(--line);padding-top:14px}
.foot .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);
  font-weight:640;direction:ltr;unicode-bidi:isolate;display:inline-block}
/* פס העתקה: המשפט כפי שיישלח, וכפתור אחד שמעתיק אותו בדיוק */
.strip{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-top:10px}
.strip .lbl{font-size:10px;letter-spacing:.11em;color:var(--ink-3);font-weight:700;
  text-transform:uppercase;margin-bottom:5px}
.strip .body{display:flex;gap:11px;align-items:flex-start}
.strip .t{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);line-height:1.7;
  overflow-wrap:anywhere}
.strip button{flex:none;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--line-2);background:var(--soft);color:var(--ink);
  border-radius:8px;padding:7px 12px;min-height:36px}
.strip button:hover{background:var(--brand-soft);border-color:var(--brand)}
.strip button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.subnote{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:8px}
.acts{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.acts button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:9px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  padding:9px 15px;min-height:40px}
.acts button:hover{background:var(--soft)}
.acts button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.acts .main{background:var(--brand);border-color:var(--brand);color:var(--brand-fg);font-weight:620}
/* ירוק ווטסאפ — הצבע היחיד בדף שאינו מהפלטה, כי הוא מזהה יעד חיצוני */
.acts .wa{background:#25A34A;border-color:#25A34A;color:#FFFFFF;font-weight:620}
.acts .wa:hover{background:#1F8C3F;border-color:#1F8C3F}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);

  } else if (!iid || !/^[0-9a-f]{8}$/.test(iid)) {
    iid = newId();
    if (!sset(K_ID, iid)) { iid = NOSTORE; }
  }
  var who = sget(K_WHO) || '';

  /* Where is this copy running from? This is the field that tells you who is
     about to get stuck on an old build. */
  function srcKind() {
    try {
      if (location.protocol !== 'file:') return 'web';
      var p = decodeURIComponent(location.pathname);
      return p.indexOf('ClearShift Tools') >= 0 ? 'shared' : 'local';
    } catch (e) { return '?'; }
  }

  /* ------------------------------------------------------------------ chrome */
  var HIDE_ID = 'skg-hide';
  var CSS = [
    /* keep the app invisible AND unclickable until a verdict exists. Not
       display:none — layout still has to happen so the app can measure itself. */
    'html.skg-wait{background:#050818}',
    'html.skg-wait body>*:not(.skg):not(.ski){visibility:hidden!important;pointer-events:none!important}',
    '.skg{position:fixed;inset:0;z-index:2147483100;display:grid;place-items:center;',
    '  background:radial-gradient(100% 80% at 50% 42%,#0A1130 0%,#050818 40%,#010206 72%,#000 100%);',
    '  font-family:"Segoe UI Variable Text","Segoe UI","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;',
    '  direction:rtl;color:#DCE6FF;-webkit-font-smoothing:antialiased}',
    '.skg.gone{opacity:0;transition:opacity .3s ease;pointer-events:none}',
    '.skg-box{width:min(92vw,430px);text-align:center;padding:0 20px}',
    '.skg-rule{height:1px;margin:0 auto 22px;width:min(58vmin,260px);',
    '  background:linear-gradient(90deg,transparent,rgba(138,169,255,.55),transparent)}',
    '.skg-h{font-size:19px;font-weight:640;letter-spacing:-.01em;color:#F2F6FF;margin:0 0 10px}',
    '.skg-p{font-size:14.5px;line-height:1.65;color:#93A8D6;margin:0}',
    '.skg-p.big{font-size:16px;color:#DCE6FF}',
    '.skg-f{margin-top:26px;font-size:11.5px;letter-spacing:.06em;color:#4C5F8C}',
    '.skg-row{margin-top:18px;display:flex;gap:8px;justify-content:center}',
    '.skg-in{flex:1;min-width:0;padding:11px 13px;border-radius:9px;text-align:right;',
    '  background:rgba(255,255,255,.05);border:1px solid rgba(138,169,255,.28);',
    '  color:#F2F6FF;font:inherit;font-size:15px;outline:none}',
    '.skg-in:focus{border-color:#2F55E8;background:rgba(47,85,232,.12)}',
    '.skg-b{padding:11px 20px;border-radius:9px;border:0;cursor:pointer;font:inherit;',
    '  font-size:14.5px;font-weight:640;background:#2F55E8;color:#fff}',
    '.skg-b:hover{background:#4468F5}',
    '.skg-err{margin-top:9px;font-size:12.5px;color:#E0796F;min-height:16px}',
    '.skg-dots{margin-top:14px;font-size:12.5px;color:#4C5F8C;letter-spacing:.08em}',
    '@media (prefers-reduced-motion:reduce){.skg,.skg *{transition:none!important}}'
  ].join('\n');

  var st = document.createElement('style');
  st.id = HIDE_ID;
  st.textContent = CSS;
  (document.head || document.documentElement).appendChild(st);
  document.documentElement.classList.add('skg-wait');

  var cover = null;
  function mkCover() {
    if (cover) return cover;
    cover = document.createElement('div');
    cover.className = 'skg';
    cover.style.opacity = '0';
    /* invisible but still on top: without this it would swallow the click that
       skips the intro */
    cover.style.pointerEvents = 'none';
    var box = document.createElement('div');
    box.className = 'skg-box';
    cover.appendChild(box);
    cover._box = box;
    (document.body || document.documentElement).appendChild(cover);
    return cover;
  }
  /* build a panel out of textContent only — never innerHTML, anywhere */
  function paint(parts) {
    var c = mkCover(), box = c._box, i, p, el;
    while (box.firstChild) box.removeChild(box.firstChild);
    var rule = document.createElement('div'); rule.className = 'skg-rule';
    box.appendChild(rule);
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      el = document.createElement(p.t || 'div');
      if (p.c) el.className = p.c;
      if (p.x != null) el.textContent = p.x;
      if (p.f) p.f(el);
      box.appendChild(el);
    }
    c.style.opacity = '1';
    c.style.pointerEvents = 'auto';
    return box;
  }
  function reveal() {
    document.documentElement.classList.remove('skg-wait');
    if (cover) {
      cover.classList.add('gone');
      setTimeout(function () { if (cover && cover.parentNode) cover.parentNode.removeChild(cover); }, 320);
    }
  }

  /* --------------------------------------------------------------- telemetry */
  /* An <img> beacon, deliberately: an image request is not subject to CORS at
     all, so the log endpoint needs no permissive headers and we never read a
     response. Nothing comes back into the page. */
  function ping(ev, label) {
    if (!CFG.log) return;
    try {
      var q = '?ev=' + encodeURIComponent(ev) +
              '&tool=' + encodeURIComponent(CFG.tool) +
              '&ver=' + encodeURIComponent(CFG.verS) +
              '&iid=' + encodeURIComponent(iid) +
              '&who=' + encodeURIComponent(who) +
              '&src=' + encodeURIComponent(srcKind()) +
              (label ? '&x=' + encodeURIComponent(String(label).slice(0, 40)) : '') +
              '&t=' + (new Date()).getTime();
      var im = new Image();
      im.referrerPolicy = 'no-referrer';
      im.src = CFG.log + q;
    } catch (e) {}
  }

  /* ---------------------------------------------------------------- decision */
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  /* Rebuild a known-shape object from the response. Nothing from the wire is
     kept by reference, merged, or trusted for its type. */
  function sanitize(txt) {
    var o = JSON.parse(txt), out = { all: 0, msg: 1, min: 0, k: [], dev: [] }, t, i, n;
    if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
    if (o.all === 2) out.all = 2;
    if (o.msg === 2) out.msg = 2;
    if (o.tools && typeof o.tools === 'object' && has(o.tools, CFG.tool)) {
      t = o.tools[CFG.tool];
      if (t && typeof t === 'object' && !Array.isArray(t)) {
        if (typeof t.min === 'number' && isFinite(t.min)) out.min = t.min | 0;
        if (Array.isArray(t.k)) {
          for (i = 0; i < t.k.length && out.k.length < 60; i++) {
            n = t.k[i];
            if (typeof n === 'number' && isFinite(n)) out.k.push(n | 0);
          }
        }
      }
    }
    if (Array.isArray(o.dev)) {
      for (i = 0; i < o.dev.length && out.dev.length < 800; i++) {
        if (typeof o.dev[i] === 'string' && /^[0-9a-f]{8}$/.test(o.dev[i])) out.dev.push(o.dev[i]);
      }
    }
    return out;
  }

  function verdictFrom(g) {
    if (g.dev.indexOf(iid) >= 0) return { ok: false, code: 2 };   /* this device */
    if (g.all === 2)             return { ok: false, code: g.msg }; /* everything */
    if (VER > 0 && g.min && VER < g.min) return { ok: false, code: 1 };
    if (VER > 0 && g.k.indexOf(VER) >= 0) return { ok: false, code: 1 };
    return { ok: true, code: 0 };
  }

  /* offline brake: only the build date, and only after the grace window */
  function localVerdict() {
    var last = sget(K_OK), now = (new Date()).getTime(), d, age;
    if (last && /^[0-9]{1,15}$/.test(last) &&
        (now - parseInt(last, 10)) < CFG.ttl * 3600e3) return { ok: true, code: 0 };
    if (/^\d{4}-\d{2}-\d{2}$/.test(CFG.built)) {
      d = Date.parse(CFG.built + 'T00:00:00');
      if (isFinite(d)) {
        age = (now - d) / 86400e3;
        if (age > CFG.maxAge) return { ok: false, code: 1 };
      }
    }
    return { ok: true, code: 0 };   /* fail-open */
  }

  function ask() {
    return new Promise(function (res) {
      if (/[?&]nocheck=1\b/.test(location.search)) return res({ ok: true, code: 0 });
      if (!CFG.gate || !window.fetch) return res(localVerdict());

      var ctl = null, killed = false;
      try { ctl = new AbortController(); } catch (e) {}
      var giveUp = setTimeout(function () {
        killed = true;
        try { if (ctl) ctl.abort(); } catch (e) {}
        res(localVerdict());
      }, CFG.wait);

      var url = CFG.gate + (CFG.gate.indexOf('?') < 0 ? '?' : '&') +
                't=' + (new Date()).getTime();
      var opt = { cache: 'no-store', redirect: 'follow', referrerPolicy: 'no-referrer' };
      if (ctl) opt.signal = ctl.signal;

      fetch(url, opt).then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.text();
      }).then(function (txt) {
        if (killed) return;
        clearTimeout(giveUp);
        if (txt.length > 2048) throw new Error('too big');   /* cap before parse */
        var g = sanitize(txt);
        if (!g) throw new Error('shape');
        var v = verdictFrom(g);
        if (v.ok) sset(K_OK, String((new Date()).getTime()));
        res(v);
      })['catch'](function () {
        if (killed) return;
        clearTimeout(giveUp);
        res(localVerdict());   /* unreachable, 404, garbage -> fail open */
      });
    });
  }

  /* ------------------------------------------------------------------- intro */
  function onReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn, false);
    } else { fn(); }
  }

  /* Resolves when the SK intro is done — or straight away when it is not
     playing at all. data-once="session" makes sk-intro skip play() entirely,
     and in that case it never fires sk-intro:done, so waiting on the event
     alone would hang the gate for its whole safety timeout. */
  function introDone() {
    return new Promise(function (res) {
      var settled = false;
      function fin() { if (!settled) { settled = true; res(); } }
      document.addEventListener('sk-intro:done', fin, false);
      if (!window.SKIntro) { onReady(fin); return; }
      onReady(function () {
        setTimeout(function () { if (!document.querySelector('.ski')) fin(); }, 150);
      });
      setTimeout(fin, 12000);
    });
  }

  /* -------------------------------------------------------------- enrollment */
  function enroll() {
    return new Promise(function (res) {
      if (!storeOK) return res();          /* nowhere to keep it — don't nag */
      if (who) return res();

      var listId = 'skg-team';
      var box = paint([
        { c: 'skg-h', x: 'מה השם שלך? (בעברית)' },
        { c: 'skg-p', x: 'פעם אחת בלבד, לכל הכלים על המכשיר הזה.' }
      ]);

      var row = document.createElement('div'); row.className = 'skg-row';
      var inp = document.createElement('input');
      inp.className = 'skg-in';
      inp.type = 'text';
      inp.setAttribute('list', listId);
      inp.setAttribute('autocomplete', 'off');
      inp.setAttribute('spellcheck', 'false');
      inp.maxLength = 40;
      inp.placeholder = 'התחל להקליד…';

      var dl = document.createElement('datalist');
      dl.id = listId;
      for (var i = 0; i < TEAM.length; i++) {
        var op = document.createElement('option');
        op.value = TEAM[i];
        dl.appendChild(op);
      }

      var btn = document.createElement('button');
      btn.className = 'skg-b';
      btn.type = 'button';
      btn.textContent = 'המשך';

      row.appendChild(inp); row.appendChild(btn);
      box.appendChild(row); box.appendChild(dl);

      var err = document.createElement('div'); err.className = 'skg-err';
      box.appendChild(err);

      var foot = document.createElement('div');
      foot.className = 'skg-f';
      foot.textContent = 'מזהה מכשיר ' + iid;
      box.appendChild(foot);

      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);

      function go() {
        var v = inp.value.replace(/\s+/g, ' ').trim();
        /* Hebrew letters, space, hyphen, geresh. Own-goal injection is as easy
           as any other, so the user's own input is validated too. */
        if (v.length < 2 || v.length > 40 || !/^[א-ת][א-ת '׳-]*$/.test(v)) {
          err.textContent = 'נא להקליד שם בעברית';
          try { inp.focus(); } catch (e) {}
          return;
        }
        who = v;
        sset(K_WHO, who);
        ping('join');
        res();
      }
      btn.addEventListener('click', go, false);
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); go(); }
      }, false);
    });
  }

  /* Make the device id readable off a screenshot: the build stamp already sits
     in the top bar of every tool, so the id goes next to it. */
  function stampId() {
    try {
      var e = document.querySelector('.ver');
      if (e && e.textContent.indexOf(iid) < 0) {
        e.textContent = e.textContent + ' · ' + iid;
        if (e.title) e.title = e.title + ' — מזהה מכשיר ' + iid;
      }
    } catch (x) {}
  }

  /* -------------------------------------------------------------------- flow */
  var resolveReady;
  var ready = new Promise(function (r) { resolveReady = r; });

  var asking = ask();          /* fires immediately, in parallel with the intro */
  var waiting = introDone();

  /* Dead-man switch. If 20s pass with nothing painted and nothing decided, the
     gate is what is broken — let the person work. It fires only in limbo: a
     real block has painted a panel by then and is left alone. */
  setTimeout(function () {
    if (cover && cover._box && cover._box.firstChild) return;
    document.documentElement.classList.remove('skg-wait');
    if (cover && cover.parentNode) cover.parentNode.removeChild(cover);
  }, 20000);

  /* if the answer is late, say so rather than showing a frozen logo */
  var slow = setTimeout(function () {
    if (!document.querySelector('.skg-dots')) {
      var box = mkCover()._box;
      if (!box.firstChild) {
        paint([{ c: 'skg-dots', x: 'מאמת גרסה…' }]);
      }
    }
  }, 5200);

  Promise.all([asking, waiting]).then(function (r) {
    clearTimeout(slow);
    var v = r[0];

    if (!v.ok) {
      ping('block');
      paint([
        { c: 'skg-h', x: 'הממשק אינו זמין' },
        { c: 'skg-p big', x: MSG[v.code] || MSG[2] },
        { c: 'skg-f', x: CFG.tool + ' · ' + CFG.verS + ' · מזהה מכשיר ' + iid }
      ]);
      resolveReady(false);
      return;
    }

    enroll().then(function () {
      stampId();
      ping('open');
      reveal();
      resolveReady(true);
    });
  })['catch'](function () {
    /* the gate itself must never be what breaks a tool */
    clearTimeout(slow);
    reveal();
    resolveReady(true);
  });

  window.SKGate = {
    ready : ready,
    use   : function (label) { ping('use', label); },
    get id()  { return iid; },
    get who() { return who; },
    forget: function () { sdel(K_WHO); sdel(K_ID); sdel(K_OK); },
    config: CFG
  };
})();

</script><!--/SKGATE-->

/* 'f' מלא · 'e' מקוצר · 'n' אין פרסום */
function kindOf(iso){
  const h=HOL[iso]; if(h)return h;
  const d=dowOf(iso);
  if(d===6||d===0)return 'n';
  if(d===5)return 'e';
  return 'f';
}
const PUB   ={f:15*60+30, e:12*60};
const HOLDAT={f:13*60,    e:10*60};

function ilNow(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{
    timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',hourCycle:'h23'
  }).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`,minutes:(+p.hour)*60+(+p.minute),
          time:`${p.hour}:${p.minute}`};
}

/* השער שהיה בתוקף ברגע נתון: האחרון שפורסם עד אותו רגע.
   שער של יום X נכנס לתוקף בשעת הפרסום של X. */
function rateAt(iso,minutes){
  for(let i=RATES.length-1;i>=0;i--){
    const e=RATES[i];
    if(e.d<iso)return e;
    if(e.d===iso&&minutes>=PUB[kindOf(e.d)])return e;
  }
  return null;
}
/* חלון ההמתנה — רק לרגע הנוכחי */
function holdNow(){
  const n=ilNow(), k=kindOf(n.date);
  if(k==='n')return null;
  if(n.minutes>=HOLDAT[k]&&n.minutes<PUB[k])
    return {from:HOLDAT[k],to:PUB[k],left:PUB[k]-n.minutes};
  return null;
}
function dayLabel(iso){
  return HOLNAME[iso]||('יום '+HDOW[dowOf(iso)]);
}

   הכלי לא סומך על כך שהעדכון האוטומטי עבד. הוא מחשב מה התאריך שאמור
   להיות בידיו — יום הפרסום האחרון שכבר עבר — ומשווה למה שמוטמע בו.
   אם חסרים ימי פרסום הוא אומר את זה במפורש, במקום להציג שער ישן כאילו
   הוא של היום. */
function lastExpectedRateDate(){
  const n=ilNow();
  for(let i=0;i<21;i++){
    const iso=addD(n.date,-i), k=kindOf(iso);
    if(k==='n')continue;
    if(i===0&&n.minutes<PUB[k])continue;
    return iso;
  }
  return '';
}
function staleBy(){
  const exp=lastExpectedRateDate(), have=RATES[RATES.length-1].d;
  if(!exp||have>=exp)return null;
  let miss=0, cur=exp;
  while(cur>have&&miss<40){
    if(kindOf(cur)!=='n')miss++;
    cur=addD(cur,-1);
  }
  return {expected:exp,have:have,missing:miss};
}
function staleFlag(){
  const s=staleBy(); if(!s)return null;
  return el('div',{class:'flag bad'},el('span',{class:'pip'}),
    el('span',{},el('b',{},`השער בכלי אינו מעודכן — חסרים ${s.missing} ימי פרסום. `),
      `האחרון שיש בכלי הוא של ${fmtD(s.have)}, והאחרון שאמור להיות הוא של ${fmtD(s.expected)}. `+
      `אל תנקוב בסכום שקלי לפני שבודקים את השער באתר בנק ישראל.`));
}

const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{const n=document.createElement(t);
  for(const[k,v]of Object.entries(a)){
    if(k==='class')n.className=v; else if(k==='html')n.innerHTML=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==undefined&&v!==false)n.setAttribute(k,v);}
  kids.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));
  return n;};
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const nnum=s=>Number(String(s??'').replace(/[^\d.]/g,''))||0;
const usd=n=>'$'+Number(n).toLocaleString('en-US');
const ils=n=>'₪'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){const t=el('div',{class:'toast'},m);$('#app').append(t);setTimeout(()=>t.remove(),2600);}
function copy(txt,msg){
  const done=()=>toast(msg||'הועתק');
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,()=>fb());
  else fb();
  function fb(){const ta=el('textarea',{style:'position:fixed;opacity:0;top:0'});ta.value=txt;
    document.body.append(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('ההעתקה נכשלה');}ta.remove();}
}

/* ---- חישוב השובר ----
   מתיחה שומרת על אחוז התוספת של המסלול ומעלה את העלות. */
function calc(){
  const t=VOUCHERS.find(x=>x.k===S.tier); if(!t)return null;
  let pay=t.pay, how='מסלול בסיס';
  if(S.mode==='amount'&&nnum(S.amount)>0){pay=nnum(S.amount);how='לפי סכום';}
  else if(S.mode==='cycle'&&nnum(S.cycle)>0){
    pay=Math.ceil((nnum(S.cycle)*t.fee/(1+t.bonus))/100)*100; how='לפי מחזור';
  }
  if(pay<t.pay)pay=t.pay;
  const red=Math.round(pay*(1+t.bonus));
  return {t,pay,red,bonus:t.bonus,fee:t.fee,how,covers:Math.round(red/t.fee)};
}
function usdShort(n){
  if(n>=1e6){const m=n/1e6;return `${m%1?m.toFixed(1):m} מיליון דולר`;}
  if(n>=1000)return `${Math.round(n/1000)} אלף דולר`;
  return `${n} דולר`;
}

        `החישוב למעלה הוא לפי השער הקודם.`)));
  else if(!q.past)
    b.append(el('div',{class:'flag ok'},el('span',{class:'pip'}),
      el('span',{},el('b',{},'תקף לחיוב. '),validUntilText())));

  box.append(b); host.append(box);

/* עד מתי השער הנוכחי תקף — כלומר מתי נפתח חלון ההמתנה הבא */
function validUntilText(){
  const n=ilNow();
  for(let i=0;i<21;i++){
    const dt=new Date(n.date+'T12:00:00Z'); dt.setUTCDate(dt.getUTCDate()+i);
    const iso=dt.toISOString().slice(0,10), k=kindOf(iso);
    if(k==='n')continue;
    if(i===0&&n.minutes>=HOLDAT[k])continue;
    return `עד יום ${HDOW[dowOf(iso)]} בשעה ${hhmm(HOLDAT[k])}.`;
  }
  return '';
}

/* מצב צילום — הבלוק לבד על כל המסך, מוגדל למקסימום שנכנס.
   כך צילום מסך אחד תופס אותו שלם, בלי הלשוניות ובלי הערת השקלים. */
let capOn=false, capFade=null;
function capMode(){
  if(capOn)return;
  capOn=true;
  const card=$('#shot'), home=$('#shotwrap');
  const layer=el('div',{class:'cap-mode',id:'capmode'});
  const close=el('button',{class:'cap-x',id:'capx',onclick:capExit},'סגור');
  const tip=el('div',{class:'cap-tip',id:'captip'},'צלם מסך · הקשה על הרקע סוגרת');
  layer.append(card);
  layer.addEventListener('click',ev=>{if(ev.target===layer)capExit();});
  document.body.append(layer,close,tip);
  /* מתפוגגים כדי שהמסך יהיה נקי לצילום */
  capFade=setTimeout(()=>{close.classList.add('gone');tip.classList.add('gone');},2600);
  const fit=()=>{
    card.style.transform='none';
    const w=card.offsetWidth, h=card.offsetHeight;
    const k=Math.min((window.innerWidth-20)/w,(window.innerHeight-20)/h,1.8);
    card.style.transform='scale('+k.toFixed(3)+')';
  };
  fit();
  layer._fit=fit; layer._home=home;
  window.addEventListener('resize',fit);
  document.addEventListener('keydown',capKey);
}
function capExit(){
  const layer=$('#capmode'); if(!layer)return;
  const card=$('#shot');
  card.style.transform='none';
  layer._home.append(card);
  window.removeEventListener('resize',layer._fit);
  document.removeEventListener('keydown',capKey);
  clearTimeout(capFade);
  layer.remove();
  ['#capx','#captip'].forEach(s=>{const n=$(s); if(n)n.remove();});
  capOn=false;
}
function capKey(e){ if(e.key==='Escape')capExit(); }

/* שם הקובץ: שם הלקוח בלי גרשיים, ואחריו גודל השובר — העלות בלבד,
   בלי מע"מ ובלי התוספת. למשל: ספיר בעמ שובר 1000 */
function docFileName(){
  const r=calc();
  const company=String(S.company||'')
    .replace(/["'״׳“”‘’]/g,'')  /* גרשיים ומרכאות מכל הסוגים */
    .replace(/[\\\/:*?<>|]/g,'')                              /* תווים שאסורים בשם קובץ */
    .replace(/\s+/g,' ').trim();
  return (company?company+' ':'')+'שובר'+(r?' '+r.pay:'');
}

/* שמירה כ-PDF דרך חלון ההדפסה. הדפדפן גוזר את שם הקובץ המוצע מכותרת
   המסמך, אז מחליפים אותה לרגע ומחזירים אחרי ההדפסה. */
function savePdf(){
  const prev=document.title;
  document.title=docFileName();
  const restore=()=>{document.title=prev;window.removeEventListener('afterprint',restore);};
  window.addEventListener('afterprint',restore);
  toast('ביעד ההדפסה בחר "שמור כ-PDF"');
  setTimeout(()=>{ window.print(); setTimeout(restore,60000); },700);
}

/* ---- הורדת הטופס כתמונה ----
   דפדפן לא יכול לכתוב PDF בלי ספריית PDF מוטמעת, אבל תמונה כן — וזה מה
   שבאמת יורד למכשיר בלחיצה אחת ומתאים לשליחה בוואטסאפ.
   העיקרון: עוטפים את הכרטיס ב-foreignObject בתוך SVG, מציירים לקנבס ומורידים.
   ה-CSS חייב להיכנס פנימה, כי גופן חוקי SVG לא רואה את הגלימה של הדף. */
function shotCss(){
  /* box-sizing חייב להיכנס במפורש: הוא מוגדר בדף בכוכבית ולא ב-.shot, ובלעדיו
     הרוחב והריפוד מסתכמים לרוחב גדול מה-SVG והצד הימני נחתך. */
  let out='*{box-sizing:border-box}\n';
  for(const sheet of document.styleSheets){
    let rules; try{rules=sheet.cssRules;}catch(e){continue;}
    for(const r of rules){
      if(r.selectorText&&/(^|,)\s*\.shot(\s|\.|,|$)/.test(r.selectorText)) out+=r.cssText+'\n';
    }
  }
  return out;
}
/* מייצר את התמונה ומחזיר Blob. משמש גם להורדה וגם לשיתוף. */
async function shotBlob(k){
  const card=$('#shot'); if(!card)throw new Error('no card');
  const w=card.offsetWidth, h=card.offsetHeight;
  const clone=card.cloneNode(true);
  clone.style.transform='none'; clone.style.margin='0';
  clone.style.width=w+'px'; clone.style.maxWidth='none';
  /* XMLSerializer סוגר תגיות ריקות כמו img — בלי זה ה-SVG לא נפרס */
  const markup=new XMLSerializer().serializeToString(clone);
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+
    '<foreignObject x="0" y="0" width="100%" height="100%">'+
    '<div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:'+w+'px;background:#fff">'+
    '<style>'+shotCss()+'</style>'+markup+'</div></foreignObject></svg>';
  const img=new Image();
  img.decoding='sync';
  await new Promise((res,rej)=>{
    img.onload=res; img.onerror=()=>rej(new Error('svg load failed'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
  const cv=document.createElement('canvas');
  cv.width=Math.round(w*k); cv.height=Math.round(h*k);
  const cx=cv.getContext('2d');
  cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,cv.width,cv.height);
  cx.setTransform(k,0,0,k,0,0);
  cx.drawImage(img,0,0);
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  if(!blob)throw new Error('toBlob failed');
  return blob;
}
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=el('a',{href:url,download:name});
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),20000);
}
async function downloadImage(btn){
  const old=btn.textContent; btn.disabled=true; btn.textContent='מכין…';
  try{
    saveBlob(await shotBlob(3),docFileName()+'.png');
    toast('הטופס הורד כתמונה');
  }catch(e){
    toast('הדפדפן לא אישר יצירת תמונה — השתמש ב"מצב צילום" וצלם מסך');
  }finally{ btn.disabled=false; btn.textContent=old; }
}

/* ---- שליחה בוואטסאפ ----
   אין דרך לפתוח את ווטסאפ עם תמונה בפנים: קישורי wa.me מעבירים טקסט בלבד.
   הדרך היחידה להעביר קובץ היא תפריט השיתוף של מערכת ההפעלה, שבו ווטסאפ
   מופיע כיעד. במחשב שאין בו שיתוף קבצים — מורידים את התמונה ופותחים
   ווטסאפ ווב, והמשתמש גורר אותה לשיחה. */
async function shareWhatsApp(btn){
  const old=btn.textContent; btn.disabled=true; btn.textContent='מכין…';
  let blob=null;
  try{ blob=await shotBlob(3); }
  catch(e){
    toast('יצירת התמונה נכשלה — השתמש ב"מצב צילום" וצלם מסך');
    btn.disabled=false; btn.textContent=old; return;
  }
  const name=docFileName()+'.png';
  try{
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:docFileName()});
      btn.disabled=false; btn.textContent=old; return;         /* נשלח, או שהמשתמש ביטל */
    }
    throw new Error('file share unsupported');
  }catch(e){
    if(e&&e.name==='AbortError'){ btn.disabled=false; btn.textContent=old; return; }
    /* גיבוי למחשב: מורידים ופותחים ווטסאפ ווב */
    saveBlob(blob,name);
    toast('התמונה הורדה — גרור אותה לשיחה בוואטסאפ');
    window.open('https://web.whatsapp.com/','_blank','noopener');
  }finally{ btn.disabled=false; btn.textContent=old; }
}
/* תנאי השירות של השובר. הכתובת נקייה — הקידומת chrome-extension של תוסף
   ה-PDF שמופיעה כשמעתיקים משורת הכתובת לא עובדת אצל הלקוח. */
const TERMS_URL='https://clearshift.co.il/wp-content/uploads/2025/07/Voucher-Terms-June-2025.pdf';
const TERMS_TEXT='אלו תנאי השירות של השובר - '+TERMS_URL;

/* פס עם משפט מוכן לשליחה וכפתור שמעתיק אותו כמו שהוא */
function strip(label,text,btn,toastMsg){
  const t=el('div',{class:'t'},text);
  return el('div',{class:'strip'},
    el('div',{class:'lbl'},label),
    el('div',{class:'body'},t,
      el('button',{onclick:()=>copy(text,toastMsg)},btn||'העתק')));
}

function foot(r){
  const host=$('#foot'); if(!host)return;
  const n=ilNow(), e=rateAt(n.date,n.minutes), h=holdNow();
  host.innerHTML='';
  if(e){
    const tot=r.pay*e.r*(1+VAT);
    const sentence=`למימון בשקלים: ${ils(tot)} — סכום השובר ${usd(r.pay)} + מע"מ 18%, `+
      `לפי השער היציג של בנק ישראל ${e.r} מיום ${fmtD(e.d)}.`;
    const sf=staleFlag(); if(sf)host.append(sf);
    host.append(strip('סכום בשקלים',sentence,'העתק','המשפט הועתק'));
    host.append(el('div',{class:'subnote'},
      h?`חלון המתנה ${hhmm(h.from)}–${hhmm(h.to)} — הסכום זמני עד לפרסום השער של היום.`
       :'לא נכלל בצילום — הבלוק שנשלח ללקוח נקוב בדולרים בלבד.'));
  }
  host.append(strip('תנאי השירות',TERMS_TEXT,'העתק','תנאי השירות הועתקו'));
}

render();
setInterval(()=>{if(capOn)return;
  if(S.tab==='ils')ilsResult(); else{const r=calc();if(r)foot(r);}},60000);
</script>
