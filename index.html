<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voucher Master">
</head>
<body style="margin:0">
<title>VOUCHER MASTER</title>
<style>
/* רקע לבן בכל מצב — הכלי לא מתחלף למצב כהה גם אם המכשיר מוגדר כהה.
   הקווים והמילויים האפורים הם מה שנותן את ההיררכיה על גבי הלבן. */
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  --bg:#FFFFFF; --card:#FFFFFF; --soft:#F4F5F7;
  --ink:#16181D; --ink-2:#5A616C; --ink-3:#8A919C;
  --line:#E2E5EA; --line-2:#C9CED5;
  --brand:#1F4A6B; --brand-2:#2E7FB8; --brand-soft:#EAF1F6; --brand-fg:#FFFFFF;
  --ok:#2C6A4C; --ok-soft:#E5F0EA;
  --hold:#8A6410; --hold-soft:#F7F0DE;
  --c1:#2E7FB8; --c2:#1E8F86; --c3:#4E9A4A; --c4:#D19A17; --c5:#CC5A3A; --c6:#7A5FB0;
  --ui:"Segoe UI Variable Text","Segoe UI","Arial Hebrew","Noto Sans Hebrew",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
#app{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:15px;line-height:1.5;min-height:100vh;padding:0 0 40px}
.wrap{max-width:660px;margin:0 auto;padding:0 18px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;
  unicode-bidi:isolate;display:inline-block}

/* ---- לשוניות ---- */
.tabs{display:flex;justify-content:center;gap:6px;padding:16px 18px 0}
.tabs button{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--ink-3);
  padding:8px 16px;border-radius:999px;min-height:38px}
.tabs button:hover{color:var(--ink-2);background:var(--soft)}
/* על רקע לבן הלשונית הפעילה מסומנת בקו ובצל, לא במילוי */
.tabs button.on{background:var(--card);border-color:var(--line-2);color:var(--ink);
  box-shadow:0 1px 3px rgba(22,24,29,.1)}
.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---- הכותרת ---- */
.hero{text-align:center;padding:34px 0 4px}
@media (max-width:520px){.hero{padding:24px 0 4px}}
.mark{font-family:var(--mono);font-weight:700;font-size:clamp(26px,8.5vw,46px);
  letter-spacing:.16em;line-height:1;white-space:nowrap;margin:0}
/* אות בצבע אחר, במחזור של שישה גוונים בעלי אותה בהירות ורוויה —
   ככה זה נקרא כמערכת אחת ולא כקונפטי. זה מקור הצבע היחיד בדף. */
.mark .l1{color:var(--c1)} .mark .l2{color:var(--c2)} .mark .l3{color:var(--c3)}
.mark .l4{color:var(--c4)} .mark .l5{color:var(--c5)} .mark .l6{color:var(--c6)}
.mark .sp{display:inline-block;width:.42em}
.mark-sub{margin-top:11px;font-size:12px;letter-spacing:.22em;color:var(--ink-3);
  font-weight:600;text-transform:uppercase}

/* ---- שורת החיפוש ---- */
.line{display:flex;align-items:center;gap:12px;margin:22px auto 0;max-width:520px;
  background:var(--card);border:1px solid var(--line-2);border-radius:999px;
  padding:6px 20px 6px 8px;box-shadow:0 1px 3px rgba(0,0,0,.05);
  transition:box-shadow .15s,border-color .15s}
.line:focus-within{box-shadow:0 2px 10px rgba(0,0,0,.09);border-color:var(--brand)}
.line .cap{font-size:13.5px;color:var(--ink-2);font-weight:600;white-space:nowrap;flex:none}
.line input{flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;
  color:var(--ink);padding:9px 0;direction:ltr;text-align:right;min-height:34px}
.line input::placeholder{color:var(--ink-3);font-size:16px}
.line.txt input{font-family:var(--ui);font-size:16px;direction:rtl;text-align:right}
.line .unit{font-family:var(--mono);color:var(--ink-3);font-size:16px;flex:none;
  padding-inline-start:4px}

/* ---- שורת בחירה ---- */
.opts{display:flex;justify-content:center;gap:7px;margin-top:14px;flex-wrap:wrap}
.opts label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border:1px solid var(--line-2);border-radius:999px;padding:7px 15px;font-size:13.5px;
  background:var(--card);min-height:38px;transition:border-color .12s,background .12s}
.opts label:hover{border-color:var(--ink-3)}
.opts label.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.opts input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;margin:0}
.opts.tight label{padding:6px 12px;font-size:12.5px;min-height:34px}
.opts.tight .amt{font-family:var(--mono);font-variant-numeric:tabular-nums}

.when{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.when input{font-family:var(--ui);font-size:15px;border:1px solid var(--line-2);
  border-radius:9px;padding:8px 11px;background:var(--card);color:var(--ink);min-height:40px}
.when input:focus{outline:2px solid var(--brand);outline-offset:-1px}

/* ---- תוצאה ---- */
.res{margin:26px auto 0;max-width:520px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden}
.res-top{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.res-top .k{font-size:11px;letter-spacing:.11em;color:var(--ink-3);font-weight:700;text-transform:uppercase}
.res-top .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:650;
  direction:ltr;unicode-bidi:isolate}
.res-top .d{font-size:12px;color:var(--ink-3)}
.res-b{padding:16px 18px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;font-size:14.5px}
.row+.row{border-top:1px dashed var(--line)}
.row .k{color:var(--ink-2)}
.row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:560;
  direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.row.tot{border-top:1.5px solid var(--line-2);margin-top:6px;padding-top:13px}
.row.tot .k{font-weight:660;color:var(--ink)}
.row.tot .v{font-size:clamp(26px,7.5vw,34px);font-weight:700;letter-spacing:-.025em;color:var(--brand)}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.65;margin-top:12px}
/* נוסחה נקראת משמאל לימין — בלי בידוד היא מתהפכת בתוך בלוק RTL */
.hint.eq{font-family:var(--mono);direction:ltr;text-align:right;unicode-bidi:isolate}
.flag{display:flex;gap:9px;align-items:flex-start;border-radius:11px;padding:11px 13px;
  font-size:12.5px;line-height:1.6;margin-top:14px}
.flag.hold{background:var(--hold-soft);color:var(--ink-2)}
.flag.hold b{color:var(--hold)}
.flag.ok{background:var(--ok-soft);color:var(--ink-2)}
.flag.ok b{color:var(--ok)}
.pip{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.flag.hold .pip{background:var(--hold)} .flag.ok .pip{background:var(--ok)}
.empty{text-align:center;color:var(--ink-3);font-size:13.5px;margin-top:26px}

/* ---- הבלוק שמצלמים ----
   תמיד בהיר, גם במצב כהה — זה יוצא כצילום מסך ללקוח. */
.shotwrap{margin:24px auto 0}

/* מצב צילום: הבלוק לבד על כל המסך, מוגדל כמה שנכנס.
   כך צילום מסך אחד בטלפון תופס אותו שלם ובגודל קריא. */
.cap-mode{position:fixed;inset:0;z-index:120;background:#EDEFF2;
  display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
.cap-mode .shot{transform-origin:center center}
/* כפתור הסגירה נעלם אחרי רגע, כדי שלא ייכנס לצילום המסך של הלקוח.
   הקשה על הרקע סוגרת בכל מצב. */
.cap-x{position:fixed;top:10px;left:10px;z-index:121;font-family:var(--ui);
  font-size:13px;font-weight:600;border:1px solid #C7CCD3;background:#FFFFFF;color:#16181D;
  border-radius:999px;padding:8px 16px;min-height:38px;cursor:pointer;opacity:.9;
  transition:opacity .5s}
.cap-x.gone{opacity:0;pointer-events:none}
.cap-tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:121;
  font-family:var(--ui);font-size:12.5px;color:#4A515C;background:rgba(255,255,255,.9);
  border-radius:999px;padding:6px 14px;transition:opacity .5s}
.cap-tip.gone{opacity:0}
@media print{
  #app>.tabs,#app .hero,#app .line,#app .opts,#app .when,#app .foot,#app .acts{display:none !important}
  .cap-x{display:none !important}
  .cap-mode{position:static;background:#fff;padding:0}
  .cap-mode .shot{transform:none !important}
}
.shot{background:#FFFFFF;color:#1A1D22;border:1px solid #D8DCE1;border-radius:14px;
  padding:20px 20px 18px;width:100%;max-width:520px;margin:0 auto;
  font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;transform-origin:top center}
.shot .logo{text-align:center;margin-bottom:14px}
.shot .logo img{height:26px}
.shot h3{margin:0 0 3px;font-size:16px;font-weight:700;text-align:center;color:#16181D}
.shot .lede{text-align:center;font-size:12px;color:#5A616C;margin:0 0 15px}
.shot table{width:100%;border-collapse:collapse;font-size:12.5px}
.shot .pk th{font-size:10.5px;letter-spacing:.06em;color:#6B727C;font-weight:700;
  padding:0 4px 5px;text-align:center;border:0}
.shot .pk td{padding:0 4px;text-align:center;border:0;font-weight:700;font-size:14px}
.shot .pk td.fit{font-weight:400;font-size:11px;color:#5A616C;padding-top:5px}
.shot .valid{text-align:center;font-size:11.5px;color:#5A616C;margin:12px 0 0}
.shot hr{border:0;border-top:1px solid #E3E5E9;margin:15px 0}
.shot .frm{font-size:13px}
.shot .frm th{text-align:right;font-weight:400;color:#5A616C;padding:3px 0;width:38%;border:0}
.shot .frm td{padding:3px 0;font-weight:700;border:0}
.shot .undertake{font-size:12px;line-height:1.6;margin:13px 0 0;color:#2C3138}
/* קישור לתנאי השירות. עובר כקישור לחיץ גם בהדפסה ל-PDF, כי זה עוגן אמיתי. */
.shot .tlink{margin:7px 0 0;font-size:12px}
.shot .tlink a{color:#1F7BC4;text-decoration:underline;text-underline-offset:2px}
.shot .sigs{display:flex;gap:16px;margin-top:18px}
.shot .sig{flex:1}
.shot .sig .cap{font-size:11px;color:#6B727C;margin-bottom:20px}
.shot .sig .rule{border-bottom:1px solid #1A1D22;height:0}
.shot .terms{font-size:10px;line-height:1.6;color:#7B828C;margin-top:15px}
.foot{max-width:520px;margin:16px auto 0;border-top:1px dashed var(--line);padding-top:14px}
.foot .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);
  font-weight:640;direction:ltr;unicode-bidi:isolate;display:inline-block}
/* פס העתקה: המשפט כפי שיישלח, וכפתור אחד שמעתיק אותו בדיוק */
.strip{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-top:10px}
.strip .lbl{font-size:10px;letter-spacing:.11em;color:var(--ink-3);font-weight:700;
  text-transform:uppercase;margin-bottom:5px}
.strip .body{display:flex;gap:11px;align-items:flex-start}
.strip .t{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);line-height:1.7;
  overflow-wrap:anywhere}
.strip button{flex:none;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--line-2);background:var(--soft);color:var(--ink);
  border-radius:8px;padding:7px 12px;min-height:36px}
.strip button:hover{background:var(--brand-soft);border-color:var(--brand)}
.strip button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.subnote{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:8px}
.acts{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.acts button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:9px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  padding:9px 15px;min-height:40px}
.acts button:hover{background:var(--soft)}
.acts button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.acts .main{background:var(--brand);border-color:var(--brand);color:var(--brand-fg);font-weight:620}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;
  font-size:13.5px;font-weight:560;z-index:99;max-width:88vw;text-align:center}
</style>
<div id="app">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

   לשונית 2: כמה שקלים למימון לפי השער היציג.
   ========================================================================== */

function rateAt(iso,minutes){
  for(let i=RATES.length-1;i>=0;i--){
    const e=RATES[i];
    if(e.d<iso)return e;
    if(e.d===iso&&minutes>=PUB[kindOf(e.d)])return e;
  }
  return null;
}
/* חלון ההמתנה — רק לרגע הנוכחי */
function holdNow(){
  const n=ilNow(), k=kindOf(n.date);
  if(k==='n')return null;
  if(n.minutes>=HOLDAT[k]&&n.minutes<PUB[k])
    return {from:HOLDAT[k],to:PUB[k],left:PUB[k]-n.minutes};
  return null;
}

const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const nnum=s=>Number(String(s??'').replace(/[^\d.]/g,''))||0;
const usd=n=>'$'+Number(n).toLocaleString('en-US');
const ils=n=>'₪'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){const t=el('div',{class:'toast'},m);$('#app').append(t);setTimeout(()=>t.remove(),2600);}
function copy(txt,msg){
  const done=()=>toast(msg||'הועתק');
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,()=>fb());
  else fb();
  function fb(){const ta=el('textarea',{style:'position:fixed;opacity:0;top:0'});ta.value=txt;
    document.body.append(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('ההעתקה נכשלה');}ta.remove();}
}

/* ---- מצב ---- */
const KEY='cs_vm_v2';
let S={tab:'calc', company:'', tier:'v2000', mode:'amount', amount:'', cycle:'',
       currency:'שקלים', fund:'', when:'now', wDate:'', wTime:''};
try{const r=localStorage.getItem(KEY); if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* ---- חישוב השובר ----
   מתיחה שומרת על אחוז התוספת של המסלול ומעלה את העלות. */
function calc(){
  const t=VOUCHERS.find(x=>x.k===S.tier); if(!t)return null;
  let pay=t.pay, how='מסלול בסיס';
  if(S.mode==='amount'&&nnum(S.amount)>0){pay=nnum(S.amount);how='לפי סכום';}
  else if(S.mode==='cycle'&&nnum(S.cycle)>0){
    pay=Math.ceil((nnum(S.cycle)*t.fee/(1+t.bonus))/100)*100; how='לפי מחזור';
  }
  if(pay<t.pay)pay=t.pay;
  const red=Math.round(pay*(1+t.bonus));
  return {t,pay,red,bonus:t.bonus,fee:t.fee,how,covers:Math.round(red/t.fee)};
}
function usdShort(n){
  if(n>=1e6){const m=n/1e6;return `${m%1?m.toFixed(1):m} מיליון דולר`;}
  if(n>=1000)return `${Math.round(n/1000)} אלף דולר`;
  return `${n} דולר`;
}

/* ================= תצוגה ================= */
/* כל אות בצבע אחר, במחזור של שישה גוונים הרמוניים */
function markEl(){
  const h=el('h1',{class:'mark'});
  let i=0;
  for(const ch of 'VOUCHER MASTER'){
    if(ch===' '){h.append(el('span',{class:'sp'}));continue;}
    h.append(el('span',{class:'l'+(i%6+1)},ch)); i++;
  }
  return h;
}
function hero(sub){
  return el('div',{class:'hero'},markEl(),el('div',{class:'mark-sub'},sub));
}
function tabs(){
  const t=$('#tabs'); t.innerHTML='';
  [['calc','חישוב שובר'],['ils','כמה שקלים למימון']].forEach(([k,label])=>{
    t.append(el('button',{class:S.tab===k?'on':'',onclick:()=>{S.tab=k;save();render();}},label));
  });
}
function render(){
  if(capOn)capExit();          /* הכרטיס מושאל למצב הצילום — מחזירים אותו לפני בנייה מחדש */
  tabs();
  const v=$('#view'); v.innerHTML='';
  v.append(S.tab==='calc'?viewCalc():viewIls());
  if(S.tab==='calc')paintShot(); else ilsResult();
}

/* ---------- לשונית 2: כמה שקלים למימון ---------- */
function viewIls(){
  const w=el('div',{class:'wrap'});
  w.append(hero('כמה שקלים למימון'));

  const inp=el('input',{type:'text',inputmode:'decimal',value:S.fund,placeholder:'2,000'});
  inp.addEventListener('input',()=>{S.fund=inp.value;save();ilsResult();});
  w.append(el('div',{class:'line'},
    el('span',{class:'cap'},'סכום שובר'),inp,el('span',{class:'unit'},'$')));

  const opts=el('div',{class:'opts'});
  [['now','לפי עכשיו'],['past','זמן עבר']].forEach(([k,label])=>{
    const i=el('input',{type:'radio',name:'when'}); i.checked=S.when===k;
    i.addEventListener('change',()=>{
      S.when=k;
      if(k==='past'&&!S.wDate){const n=ilNow();S.wDate=n.date;S.wTime=n.time;}
      save();render();});
    opts.append(el('label',{class:S.when===k?'on':''},i,label));
  });
  w.append(opts);

  if(S.when==='past'){
    const d=el('input',{type:'date',value:S.wDate});
    const t=el('input',{type:'time',value:S.wTime});
    d.addEventListener('input',()=>{S.wDate=d.value;save();ilsResult();});
    t.addEventListener('input',()=>{S.wTime=t.value;save();ilsResult();});
    w.append(el('div',{class:'when'},d,t));
  }

  w.append(el('div',{id:'ilsres'}));
  return w;
}
function whenNow(){
  if(S.when==='past'&&S.wDate){
    const p=(S.wTime||'23:59').split(':');
    return {iso:S.wDate,minutes:(+p[0])*60+(+p[1]||0),past:true};
  }
  const n=ilNow(); return {iso:n.date,minutes:n.minutes,past:false};
}
function ilsResult(){
  const host=$('#ilsres'); if(!host)return;
  host.innerHTML='';
  const q=whenNow(), e=rateAt(q.iso,q.minutes);

  if(!e){
    host.append(el('div',{class:'empty'},'אין שער מוטמע לתאריך הזה. הטבלה מתחילה ב-'+fmtD(RATES[0].d)+'.'));
    return;
  }
  const box=el('div',{class:'res'});
  box.append(el('div',{class:'res-top'},
    el('div',{},el('div',{class:'k'},q.past?'השער שהיה בתוקף':'השער שבתוקף עכשיו'),
      el('div',{class:'d'},'שער יציג מיום '+fmtD(e.d)+' · '+dayLabel(e.d))),
    el('div',{class:'v'},e.r.toFixed(4))));

  const b=el('div',{class:'res-b'});
  const amt=nnum(S.fund);
  if(amt>0){
    const net=amt*e.r, vat=net*VAT, tot=net+vat;
    const row=(k,v,c)=>el('div',{class:'row '+(c||'')},
      el('span',{class:'k'},k),el('span',{class:'v'},v));
    b.append(row('סכום השובר',usd(amt)));
    b.append(row('× שער יציג '+e.r,ils(net)));
    b.append(row('מע"מ 18%',ils(vat)));
    b.append(row('למימון',ils(tot),'tot'));
    b.append(el('div',{class:'hint eq'},
      `${amt.toLocaleString('en-US')} × ${e.r} × 1.18 = ${ils(tot)}`));
    b.append(el('div',{class:'acts'},
      el('button',{class:'main',onclick:()=>copy(String(Math.round(tot*100)/100),'הסכום הועתק')},'העתק סכום'),
      el('button',{onclick:()=>copy(
        `למימון: ${ils(tot)}\n${usd(amt)} + מע"מ 18%\nשער יציג ${e.r} מיום ${fmtD(e.d)}`,
        'הפירוט הועתק')},'העתק פירוט')));
  }else{
    b.append(el('div',{class:'empty'},'הקלד את סכום השובר בדולרים'));
  }

  const h=holdNow();
  if(!q.past&&h)
    b.append(el('div',{class:'flag hold'},el('span',{class:'pip'}),
      el('span',{},el('b',{},`חלון המתנה ${hhmm(h.from)}–${hhmm(h.to)}. `),
        `השער היציג של היום יתפרסם בעוד ${h.left} דקות. עד אז לא נועלים סכום שקלי — `+
        `החישוב למעלה הוא לפי השער הקודם.`)));
  else if(!q.past)
    b.append(el('div',{class:'flag ok'},el('span',{class:'pip'}),
      el('span',{},el('b',{},'תקף לחיוב. '),validUntilText())));

  box.append(b); host.append(box);
}
/* עד מתי השער הנוכחי תקף — כלומר מתי נפתח חלון ההמתנה הבא */
function validUntilText(){
  const n=ilNow();
  for(let i=0;i<21;i++){
    const dt=new Date(n.date+'T12:00:00Z'); dt.setUTCDate(dt.getUTCDate()+i);
    const iso=dt.toISOString().slice(0,10), k=kindOf(iso);
    if(k==='n')continue;
    if(i===0&&n.minutes>=HOLDAT[k])continue;
    return `עד יום ${HDOW[dowOf(iso)]} בשעה ${hhmm(HOLDAT[k])}.`;
  }
  return '';
}

/* ---------- לשונית 1: חישוב שובר ---------- */
function viewCalc(){
  const w=el('div',{class:'wrap'});
  w.append(hero('חישוב שובר'));

  const ci=el('input',{type:'text',value:S.company,placeholder:'לא חובה'});
  ci.addEventListener('input',()=>{S.company=ci.value;save();paintShot();});
  w.append(el('div',{class:'line txt'},el('span',{class:'cap'},'שם החברה'),ci));

  const tw=el('div',{class:'opts tight'});
  VOUCHERS.forEach(t=>{
    const i=el('input',{type:'radio',name:'tier'}); i.checked=S.tier===t.k;
    i.addEventListener('change',()=>{S.tier=t.k;save();render();});
    tw.append(el('label',{class:S.tier===t.k?'on':''},i,el('span',{class:'amt'},t.label)));
  });
  w.append(tw);

  const mw=el('div',{class:'opts'});
  [['amount','לפי סכום שובר'],['cycle','לפי מחזור']].forEach(([k,label])=>{
    const i=el('input',{type:'radio',name:'mode'}); i.checked=S.mode===k;
    i.addEventListener('change',()=>{S.mode=k;save();render();});
    mw.append(el('label',{class:S.mode===k?'on':''},i,label));
  });
  w.append(mw);

  const t=VOUCHERS.find(x=>x.k===S.tier);
  const vi=el('input',{type:'text',inputmode:'numeric',
    value:S.mode==='amount'?S.amount:S.cycle,
    placeholder:S.mode==='amount'?String(t.pay):'2,700,000'});
  vi.addEventListener('input',()=>{
    if(S.mode==='amount')S.amount=vi.value; else S.cycle=vi.value;
    save();paintShot();});
  w.append(el('div',{class:'line'},
    el('span',{class:'cap'},S.mode==='amount'?'סכום השובר':'מחזור שנתי'),
    vi,el('span',{class:'unit'},'$')));

  /* מטבע למימון — נכנס למסמך מתחת ל"סכום לרכישה" */
  const cw=el('div',{class:'opts'});
  ['שקלים','דולרים','שקלים/דולרים'].forEach(v=>{
    const i=el('input',{type:'radio',name:'cur'}); i.checked=S.currency===v;
    i.addEventListener('change',()=>{S.currency=v;save();render();});
    cw.append(el('label',{class:S.currency===v?'on':''},i,v));
  });
  w.append(cw);

  w.append(el('div',{class:'shotwrap',id:'shotwrap'},el('div',{class:'shot',id:'shot'})));
  w.append(el('div',{class:'acts'},
    el('button',{class:'main',onclick:capMode},'מצב צילום'),
    el('button',{onclick:()=>window.print()},'הדפס / PDF')));
  w.append(el('div',{class:'foot',id:'foot'}));
  return w;
}

  const bonus=r.t.bonusStyle==='amount'
    ? `הנחה של ${Math.round(r.pay*r.bonus).toLocaleString('en-US')}$`
    : `תוספת של ${Math.round(r.bonus*100)}%`;
  host.innerHTML=`
    <div class="logo"><img src="${CS_LOGO}" alt="Clearshift"></div>
    <h3>חבילת פריפייד לעסקים</h3>
    <p class="lede">הוזלה משמעותית בעמלות ההעברה</p>
    <table class="pk">
      <tr><th>מתאים עבור</th><th>עלות</th><th>שווי</th><th>הנחה</th></tr>
      <tr>
        <td class="fit">חשבון עסקי עד ${esc(usdShort(r.covers))} בשנה</td>
        <td>${usd(r.pay)}</td><td>${usd(r.red)}</td><td>${esc(bonus)}</td>
      </tr>
    </table>
    <p class="valid">החבילה תקפה 12 חודשים מתאריך ההנפקה ואינה כוללת מע"מ</p>
    <hr>
    <table class="frm">
      <tr><th>תאריך:</th><td>${fmtD(today)}</td></tr>
      <tr><th>שם החשבון:</th><td>${esc(S.company||'')}</td></tr>
      <tr><th>סכום לרכישה:</th><td>${Number(r.pay).toLocaleString('en-US')}$ + מע"מ</td></tr>
      <tr><th>מטבע למימון:</th><td>${esc(S.currency||'שקלים')}</td></tr>
    </table>
    <p class="undertake">אני מסכים בזאת לרכוש את החבילה הנ"ל בחשבון הנ"ל
    ומתחייב למימון תוך 3 ימי עסקים.</p>
    <p class="tlink"><a href="${TERMS_URL}" target="_blank" rel="noopener">תנאים</a></p>
    <div class="sigs">
      <div class="sig"><div class="cap">חתימה</div><div class="rule"></div></div>
    </div>
    <p class="terms">שווי החבילה נצבר כזיכוי עמלות ומנוצל מול עמלות ההעברה עד לגמר היתרה.
    הסכומים נקובים בדולר ואינם כוללים מע"מ. יתרה שלא נוצלה תוך 12 חודשים אינה מועברת
    לתקופה הבאה.</p>`;
  foot(r);
}

/* מצב צילום — הבלוק לבד על כל המסך, מוגדל למקסימום שנכנס.
   כך צילום מסך אחד תופס אותו שלם, בלי הלשוניות ובלי הערת השקלים. */
let capOn=false, capFade=null;
function capMode(){
  if(capOn)return;
  capOn=true;
  const card=$('#shot'), home=$('#shotwrap');
  const layer=el('div',{class:'cap-mode',id:'capmode'});
  const close=el('button',{class:'cap-x',id:'capx',onclick:capExit},'סגור');
  const tip=el('div',{class:'cap-tip',id:'captip'},'צלם מסך · הקשה על הרקע סוגרת');
  layer.append(card);
  layer.addEventListener('click',ev=>{if(ev.target===layer)capExit();});
  document.body.append(layer,close,tip);
  /* מתפוגגים כדי שהמסך יהיה נקי לצילום */
  capFade=setTimeout(()=>{close.classList.add('gone');tip.classList.add('gone');},2600);
  const fit=()=>{
    card.style.transform='none';
    const w=card.offsetWidth, h=card.offsetHeight;
    const k=Math.min((window.innerWidth-20)/w,(window.innerHeight-20)/h,1.8);
    card.style.transform='scale('+k.toFixed(3)+')';
  };
  fit();
  layer._fit=fit; layer._home=home;
  window.addEventListener('resize',fit);
  document.addEventListener('keydown',capKey);
}
function capExit(){
  const layer=$('#capmode'); if(!layer)return;
  const card=$('#shot');
  card.style.transform='none';
  layer._home.append(card);
  window.removeEventListener('resize',layer._fit);
  document.removeEventListener('keydown',capKey);
  clearTimeout(capFade);
  layer.remove();
  ['#capx','#captip'].forEach(s=>{const n=$(s); if(n)n.remove();});
  capOn=false;
}
function capKey(e){ if(e.key==='Escape')capExit(); }
/* תנאי השירות של השובר. הכתובת נקייה — הקידומת chrome-extension של תוסף
   ה-PDF שמופיעה כשמעתיקים משורת הכתובת לא עובדת אצל הלקוח. */
const TERMS_URL='https://clearshift.co.il/wp-content/uploads/2025/07/Voucher-Terms-June-2025.pdf';
const TERMS_TEXT='אלו תנאי השירות של השובר - '+TERMS_URL;

/* פס עם משפט מוכן לשליחה וכפתור שמעתיק אותו כמו שהוא */
function strip(label,text,btn,toastMsg){
  const t=el('div',{class:'t'},text);
  return el('div',{class:'strip'},
    el('div',{class:'lbl'},label),
    el('div',{class:'body'},t,
      el('button',{onclick:()=>copy(text,toastMsg)},btn||'העתק')));
}

function foot(r){
  const host=$('#foot'); if(!host)return;
  const n=ilNow(), e=rateAt(n.date,n.minutes), h=holdNow();
  host.innerHTML='';
  if(e){
    const tot=r.pay*e.r*(1+VAT);
    const sentence=`למימון בשקלים: ${ils(tot)} — סכום השובר ${usd(r.pay)} + מע"מ 18%, `+
      `לפי השער היציג של בנק ישראל ${e.r} מיום ${fmtD(e.d)}.`;
    host.append(strip('סכום בשקלים',sentence,'העתק','המשפט הועתק'));
    host.append(el('div',{class:'subnote'},
      h?`חלון המתנה ${hhmm(h.from)}–${hhmm(h.to)} — הסכום זמני עד לפרסום השער של היום.`
       :'לא נכלל בצילום — הבלוק שנשלח ללקוח נקוב בדולרים בלבד.'));
  }
  host.append(strip('תנאי השירות',TERMS_TEXT,'העתק','תנאי השירות הועתקו'));
}

render();
setInterval(()=>{if(capOn)return;
  if(S.tab==='ils')ilsResult(); else{const r=calc();if(r)foot(r);}},60000);
</script>
